name: Apply friend GID auto-discovery fix once

on:
  push:
    paths:
      - '.github/workflows/fix-friend-gid-discovery-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch friend discovery
        shell: python
        run: |
          from pathlib import Path

          friend_path = Path('core/src/services/friend.js')
          text = friend_path.read_text(encoding='utf-8')

          old = """async function fetchQqFriendsByLegacyMethod() {
    const errors = [];

    try {
        const syncReq = types.SyncAllRequest || types.SyncAllFriendsRequest;
        const syncRep = types.SyncAllReply || types.SyncAllFriendsReply;
        if (!syncReq || !syncRep) throw new Error('SyncAll 接口类型未加载');
        const body = syncReq.encode(syncReq.create({ open_ids: [] })).finish();
        const { body: replyBody } = await sendMsgAsync('gamepb.friendpb.FriendService', 'SyncAll', body);
        return extractReplyFriends(syncRep.decode(replyBody));
    } catch (e) {
        errors.push(`SyncAll: ${e.message}`);
    }

    try {
        if (!types.GetAllFriendsRequest || !types.GetAllFriendsReply) throw new Error('GetAll 接口类型未加载');
        const body = types.GetAllFriendsRequest.encode(types.GetAllFriendsRequest.create({})).finish();
        const { body: replyBody } = await sendMsgAsync('gamepb.friendpb.FriendService', 'GetAll', body);
        return extractReplyFriends(types.GetAllFriendsReply.decode(replyBody));
    } catch (e) {
        errors.push(`GetAll: ${e.message}`);
    }

    throw new Error(errors.join(' | '));
}
"""
          new = """async function fetchQqFriendsByLegacyMethods() {
    const errors = [];
    const allFriends = [];
    let succeeded = 0;

    // SyncAll 和 GetAll 都是发现来源。旧逻辑在 SyncAll 成功但返回空列表时
    // 会提前 return，导致 GetAll 永远没有机会发现更多好友。
    try {
        const syncReq = types.SyncAllRequest || types.SyncAllFriendsRequest;
        const syncRep = types.SyncAllReply || types.SyncAllFriendsReply;
        if (!syncReq || !syncRep) throw new Error('SyncAll 接口类型未加载');
        const body = syncReq.encode(syncReq.create({ open_ids: [] })).finish();
        const { body: replyBody } = await sendMsgAsync('gamepb.friendpb.FriendService', 'SyncAll', body);
        allFriends.push(...extractReplyFriends(syncRep.decode(replyBody)));
        succeeded++;
    } catch (e) {
        errors.push(`SyncAll: ${e.message}`);
    }

    try {
        if (!types.GetAllFriendsRequest || !types.GetAllFriendsReply) throw new Error('GetAll 接口类型未加载');
        const body = types.GetAllFriendsRequest.encode(types.GetAllFriendsRequest.create({})).finish();
        const { body: replyBody } = await sendMsgAsync('gamepb.friendpb.FriendService', 'GetAll', body);
        allFriends.push(...extractReplyFriends(types.GetAllFriendsReply.decode(replyBody)));
        succeeded++;
    } catch (e) {
        errors.push(`GetAll: ${e.message}`);
    }

    if (succeeded === 0) {
        throw new Error(errors.join(' | '));
    }
    return dedupeFriendsByGid(allFriends);
}
"""
          if old not in text:
              raise SystemExit('legacy friend method block not found')
          text = text.replace(old, new, 1)

          old = """async function getAllFriends(forceSync = false) {
    const isQQ = CONFIG.platform === 'qq';
    if (isQQ) {
        await syncKnownFriendGidsFromRecentVisitors(forceSync);
        const friendsFromKnownGids = await fetchQqFriendsByKnownGids();
        if (friendsFromKnownGids.length > 0) {
            syncKnownFriendGidsFromFriends(friendsFromKnownGids);
            return buildFriendReply(friendsFromKnownGids);
        }

        try {
            const legacyFriends = dedupeFriendsByGid(await fetchQqFriendsByLegacyMethod());
            if (legacyFriends.length > 0) {
                syncKnownFriendGidsFromFriends(legacyFriends);
            } else if (getEffectiveKnownQqFriendGids().length === 0) {
                logWarn('好友', 'QQ 好友列表为空；若近期接口已切到 GetGameFriends，请先在好友页维护已知好友 GID 列表', {
                    module: 'friend',
                    event: '好友列表接口',
                    result: 'empty',
                });
            }
            return buildFriendReply(legacyFriends);
        } catch (e) {
            if (getEffectiveKnownQqFriendGids().length === 0) {
                throw new Error(`QQ 好友列表获取失败，请先在好友页维护已知好友 GID 列表。${e.message}`);
            }
            throw e;
        }
    }

    const body = types.GetAllFriendsRequest.encode(types.GetAllFriendsRequest.create({})).finish();
    const { body: replyBody } = await sendMsgAsync('gamepb.friendpb.FriendService', 'GetAll', body);
    return types.GetAllFriendsReply.decode(replyBody);
}
"""
          new = """let lastQqFullFriendDiscoveryAt = 0;

async function getAllFriends(forceSync = false) {
    const isQQ = CONFIG.platform === 'qq';
    if (isQQ) {
        // 来源 1：最近访客，可持续补充从互动记录里出现的新 GID。
        await syncKnownFriendGidsFromRecentVisitors(forceSync);

        // 来源 2：已知 GID 精确查询。它适合作为高频好友巡查接口，但不能承担“发现未知好友”。
        let friendsFromKnownGids = [];
        let knownFetchError = null;
        try {
            friendsFromKnownGids = await fetchQqFriendsByKnownGids();
        } catch (e) {
            knownFetchError = e;
        }

        // 来源 3：SyncAll + GetAll 做低频全量发现。
        // 旧逻辑只要已知 GID 查到 1 个好友就直接 return，好友池会永久锁死在旧集合。
        const now = Date.now();
        const discoveryIntervalMs = getKnownFriendGidSyncIntervalMs();
        const shouldDiscover = forceSync
            || lastQqFullFriendDiscoveryAt <= 0
            || now - lastQqFullFriendDiscoveryAt >= discoveryIntervalMs;
        let discoveredFriends = [];
        let discoveryError = null;
        if (shouldDiscover) {
            lastQqFullFriendDiscoveryAt = now;
            try {
                discoveredFriends = await fetchQqFriendsByLegacyMethods();
            } catch (e) {
                discoveryError = e;
            }
        }

        const beforeKnownCount = getEffectiveKnownQqFriendGids().length;
        const mergedFriends = dedupeFriendsByGid([
            ...friendsFromKnownGids,
            ...discoveredFriends,
        ]);

        if (mergedFriends.length > 0) {
            const mergedGids = syncKnownFriendGidsFromFriends(mergedFriends);
            const afterKnownCount = normalizeFriendGids(mergedGids).length;
            if (shouldDiscover) {
                log('好友', `QQ 好友自动发现完成：已知接口 ${friendsFromKnownGids.length}，全量接口 ${discoveredFriends.length}，合并 ${mergedFriends.length}，GID ${beforeKnownCount}->${afterKnownCount}`, {
                    module: 'friend',
                    event: '好友GID自动发现',
                    result: 'ok',
                    knownCount: friendsFromKnownGids.length,
                    discoveredCount: discoveredFriends.length,
                    mergedCount: mergedFriends.length,
                    beforeKnownCount,
                    afterKnownCount,
                    addedCount: Math.max(0, afterKnownCount - beforeKnownCount),
                });
            }
            return buildFriendReply(mergedFriends);
        }

        // 若本轮没有进行全量发现，保留空结果即可；下一次冷却到期会再次主动发现。
        if (shouldDiscover && discoveryError) {
            const details = [
                knownFetchError ? `GetGameFriends: ${knownFetchError.message}` : '',
                `full discovery: ${discoveryError.message}`,
            ].filter(Boolean).join(' | ');
            if (getEffectiveKnownQqFriendGids().length === 0) {
                throw new Error(`QQ 好友自动发现失败。${details}`);
            }
            logWarn('好友', `QQ 好友全量发现暂时失败，继续使用已知 GID：${details}`, {
                module: 'friend',
                event: '好友GID自动发现',
                result: 'degraded',
            });
        }
        return buildFriendReply([]);
    }

    const body = types.GetAllFriendsRequest.encode(types.GetAllFriendsRequest.create({})).finish();
    const { body: replyBody } = await sendMsgAsync('gamepb.friendpb.FriendService', 'GetAll', body);
    return types.GetAllFriendsReply.decode(replyBody);
}
"""
          if old not in text:
              raise SystemExit('getAllFriends block not found')
          text = text.replace(old, new, 1)

          old = """        if (friends.length > 0) {
            const names = friends.map(f => f.name || f.remark || `GID:${toNum(f.gid)}`).join(', ');
            log('申请', `已同意 ${friends.length} 人: ${names}`);
        }
"""
          new = """        if (friends.length > 0) {
            syncKnownFriendGidsFromFriends(friends);
            clearFriendsListCache();
            const names = friends.map(f => f.name || f.remark || `GID:${toNum(f.gid)}`).join(', ');
            log('申请', `已同意 ${friends.length} 人: ${names}`);
        }
"""
          if old not in text:
              raise SystemExit('accept friends block not found')
          text = text.replace(old, new, 1)

          old = """function startFriendCheckLoop(options = {}) {
    if (friendLoopRunning) return;
    externalSchedulerMode = !!options.externalScheduler;
    friendLoopRunning = true;

    // 注册操作限制更新回调，从农场检查中获取限制信息
    setOperationLimitsCallback(updateOperationLimits);

    // 监听好友申请推送 (微信同玩)
    networkEvents.on('friendApplicationReceived', onFriendApplicationReceived);
"""
          new = """function startFriendCheckLoop(options = {}) {
    if (friendLoopRunning) return;
    externalSchedulerMode = !!options.externalScheduler;
    friendLoopRunning = true;

    // 注册操作限制更新回调，从农场检查中获取限制信息
    setOperationLimitsCallback(updateOperationLimits);

    // 监听好友申请/新增好友推送。QQ 新好友一出现就进入 GID 池，不等下一轮全量发现。
    networkEvents.on('friendApplicationReceived', onFriendApplicationReceived);
    networkEvents.on('friendAdded', onFriendAdded);
"""
          if old not in text:
              raise SystemExit('start friend loop block not found')
          text = text.replace(old, new, 1)

          old = """    invalidKnownFriendGidCooldownUntil.clear();
    networkEvents.off('friendApplicationReceived', onFriendApplicationReceived);
    friendScheduler.clearAll();
}
"""
          new = """    invalidKnownFriendGidCooldownUntil.clear();
    networkEvents.off('friendApplicationReceived', onFriendApplicationReceived);
    networkEvents.off('friendAdded', onFriendAdded);
    friendScheduler.clearAll();
}
"""
          if old not in text:
              raise SystemExit('stop friend loop block not found')
          text = text.replace(old, new, 1)

          marker = """// ============ 自动同意好友申请 (微信同玩) ============

/**
 * 处理服务器推送的好友申请
 */
"""
          insert = """// ============ 自动同意好友申请 (微信同玩) ============

function onFriendAdded(friends) {
    const list = dedupeFriendsByGid(friends);
    if (list.length === 0) return;
    const before = getEffectiveKnownQqFriendGids().length;
    const merged = syncKnownFriendGidsFromFriends(list);
    const after = normalizeFriendGids(merged).length;
    clearFriendsListCache();
    log('好友', `检测到新增好友，GID 已自动同步：+${Math.max(0, after - before)}，当前 ${after} 个`, {
        module: 'friend',
        event: '好友GID自动发现',
        result: 'push',
        addedCount: Math.max(0, after - before),
        totalKnownGids: after,
    });
}

/**
 * 处理服务器推送的好友申请
 */
"""
          if marker not in text:
              raise SystemExit('friend application marker not found')
          text = text.replace(marker, insert, 1)

          friend_path.write_text(text, encoding='utf-8')

          network_path = Path('core/src/utils/network.js')
          network = network_path.read_text(encoding='utf-8')
          old = """                if (friends.length > 0) {
                    const names = friends.map(f => f.name || f.remark || `GID:${toNum(f.gid)}`).join(', ');
                    log('好友', `新好友: ${names}`);
                }
"""
          new = """                if (friends.length > 0) {
                    const names = friends.map(f => f.name || f.remark || `GID:${toNum(f.gid)}`).join(', ');
                    log('好友', `新好友: ${names}`);
                    networkEvents.emit('friendAdded', friends);
                }
"""
          if old not in network:
              raise SystemExit('FriendAddedNotify block not found')
          network = network.replace(old, new, 1)
          network_path.write_text(network, encoding='utf-8')

      - name: Syntax check
        run: |
          node --check core/src/services/friend.js
          node --check core/src/utils/network.js

      - name: Commit fix
        run: |
          git config user.name "far2-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add core/src/services/friend.js core/src/utils/network.js
          git diff --cached --check
          git commit -m "fix: auto-discover and persist QQ friend GIDs"
          git push
