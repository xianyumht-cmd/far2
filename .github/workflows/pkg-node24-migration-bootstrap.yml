name: Package Node 24 Migration Validation

on:
  push:
    branches:
      - chore/pkg-node24-yao-20260915

permissions:
  contents: read

jobs:
  windows-runtime-smoke:
    if: contains(github.event.head_commit.message, 'retry packaged runtime smoke')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web assets
        run: pnpm build:web
      - name: Build and smoke Windows Node 24 executable
        shell: pwsh
        run: |
          pnpm -C core build:win 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\pkg-win.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = Get-Content "$env:RUNNER_TEMP\pkg-win.log" -Raw
          if ($log -match "Cannot resolve 'wsPath'") { throw "pkg still cannot statically discover ws" }
          if ($log -match 'Cannot stat, ENOENT') { throw 'pkg still sees a missing statically-required path' }

          $exe = Get-ChildItem -LiteralPath 'core\dist' -File -Filter '*.exe' | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw 'No Windows .exe was produced under core\dist' }
          if ($exe.Length -lt 50MB) { throw "Windows executable is unexpectedly small: $($exe.Length)" }
          Write-Host "Windows executable: $($exe.FullName) $([math]::Round($exe.Length / 1MB, 1)) MB"

          $env:ADMIN_PORT = '31997'
          $env:FARM_AUTO_START_ACCOUNTS = '0'
          $env:ADMIN_BOOTSTRAP_PASSWORD = 'far2-ci-package-smoke-only'
          Remove-Item Env:FARM_DATA_DIR -ErrorAction SilentlyContinue
          $dataDir = Join-Path $exe.DirectoryName 'data'
          Remove-Item -LiteralPath $dataDir -Recurse -Force -ErrorAction SilentlyContinue
          $stdout = Join-Path $env:RUNNER_TEMP 'far2-package.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'far2-package.stderr.log'
          $proc = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $healthy = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-RestMethod -Uri 'http://127.0.0.1:31997/api/ping' -TimeoutSec 2
                if ($response.ok -eq $true -and $response.data.ok -eq $true) {
                  $healthy = $true
                  break
                }
              } catch {}
              if ($proc.HasExited) { break }
            }
            if (-not $healthy) {
              Write-Host '--- packaged stdout ---'
              if (Test-Path $stdout) { Get-Content $stdout }
              Write-Host '--- packaged stderr ---'
              if (Test-Path $stderr) { Get-Content $stderr }
              throw 'Packaged FAR2 did not become healthy on public /api/ping'
            }
            if (-not (Test-Path -LiteralPath $dataDir)) {
              throw "Packaged FAR2 did not create writable data directory beside executable: $dataDir"
            }
            Write-Host "Packaged runtime health PASS; writable data dir: $dataDir"
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
