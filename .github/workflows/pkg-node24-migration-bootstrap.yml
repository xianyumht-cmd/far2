name: Package Node 24 Migration Validation

on:
  push:
    branches:
      - chore/pkg-node24-yao-20260915

permissions:
  contents: read

jobs:
  verify-and-package:
    if: contains(github.event.head_commit.message, 'validate Node 24 packaging migration')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Assert migrated packaging configuration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const pkg = require('./core/package.json')
          if (pkg.devDependencies?.pkg) throw new Error('legacy vercel/pkg dependency remains')
          if (pkg.devDependencies?.['@yao-pkg/pkg'] !== '6.22.0') throw new Error('unexpected @yao-pkg/pkg version')
          for (const name of ['build:release', 'build:win', 'build:linux', 'build:mac']) {
            const script = pkg.scripts?.[name] || ''
            if (script.includes('node18-')) throw new Error(`${name} still contains node18 target`)
            if (!script.includes('node24-')) throw new Error(`${name} does not contain node24 target`)
          }
          NODE
      - name: Verify repository
        run: pnpm verify
      - name: Package all release targets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf core/dist
          pnpm -C core build:release 2>&1 | tee /tmp/pkg-build.log
          if grep -F "Cannot resolve 'wsPath'" /tmp/pkg-build.log; then
            echo 'pkg still cannot statically discover ws' >&2
            exit 1
          fi
          test -s core/dist/qq-farm-bot-win-x64.exe
          test -s core/dist/qq-farm-bot-linux-x64
          test -s core/dist/qq-farm-bot-macos-x64
          test -s core/dist/qq-farm-bot-macos-arm64
          find core/dist -maxdepth 1 -type f -print -exec ls -lh {} \;

  windows-native-package:
    if: contains(github.event.head_commit.message, 'validate Node 24 packaging migration')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web assets
        run: pnpm build:web
      - name: Build Windows Node 24 executable
        shell: pwsh
        run: |
          pnpm -C core build:win 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\pkg-win.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = Get-Content "$env:RUNNER_TEMP\pkg-win.log" -Raw
          if ($log -match "Cannot resolve 'wsPath'") { throw "pkg still cannot statically discover ws" }
          $exe = Get-Item "core\dist\qq-farm-bot-win-x64.exe"
          if ($exe.Length -lt 50MB) { throw "Windows executable is unexpectedly small: $($exe.Length)" }
          Write-Host "Windows executable: $($exe.FullName) $([math]::Round($exe.Length / 1MB, 1)) MB"
