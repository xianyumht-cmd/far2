name: Phase4 Batch3 Apply
# rerun after protobuf-aware regression initialization

on:
  push:
    branches:
      - fix/phase4-batch3-runtime-no-undef-20260915
    paths:
      - .github/workflows/phase4-batch3-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply runtime bug fixes
        run: python3 .github/scripts/phase4-batch3-apply.py
      - name: Run targeted runtime regression
        run: pnpm -C core friend:mall-runtime-selftest
      - name: Require zero no-undef in friend and mall
        shell: bash
        run: |
          pnpm -C core exec eslint src/services/friend.js src/services/mall.js --format json > /tmp/eslint.json || true
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/eslint.json','utf8'));const rows=r.flatMap(x=>x.messages.filter(m=>m.ruleId==='no-undef').map(m=>x.filePath+':'+m.line+':'+m.column+' '+m.message));if(rows.length){console.error(rows.join('\\n'));process.exit(1)}console.log('NO_UNDEF_TOTAL=0')"
      - name: Verify repository
        run: pnpm verify
      - name: Diff integrity
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain pnpm-lock.yaml)"
          git status --short
      - name: Commit verified product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/services/friend.js core/src/services/mall.js core/package.json
          git commit -m "fix(runtime): repair friend applications and mall success path"
          git push origin HEAD:fix/phase4-batch3-runtime-no-undef-20260915
