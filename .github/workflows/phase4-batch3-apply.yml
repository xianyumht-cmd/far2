name: Phase4 Batch3 Apply

on:
  push:
    branches:
      - fix/phase4-batch3-runtime-no-undef-20260915
    paths:
      - .github/workflows/phase4-batch3-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply runtime bug fixes and regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          friend_path = Path('core/src/services/friend.js')
          friend = friend_path.read_text(encoding='utf-8')
          marker = "async function acceptFriends(gids) {"
          assert friend.count(marker) == 1, 'friend acceptFriends anchor changed'
          implementation = """async function getApplications() {
              if (!types.GetApplicationsRequest || !types.GetApplicationsReply) {
                  throw new Error('GetApplications 接口类型未加载');
              }
              const body = types.GetApplicationsRequest.encode(types.GetApplicationsRequest.create({})).finish();
              const { body: replyBody } = await sendMsgAsync('gamepb.friendpb.FriendService', 'GetApplications', body);
              return types.GetApplicationsReply.decode(replyBody);
          }

          """
          assert 'async function getApplications() {' not in friend, 'getApplications already exists'
          friend = friend.replace(marker, implementation + marker, 1)
          export_anchor = "    getFriendsList,\n    getFriendLandsDetail,"
          assert friend.count(export_anchor) == 1, 'friend export anchor changed'
          friend = friend.replace(export_anchor, "    getFriendsList,\n    getApplications,\n    getFriendLandsDetail,", 1)
          friend_path.write_text(friend, encoding='utf-8')

          mall_path = Path('core/src/services/mall.js')
          mall = mall_path.read_text(encoding='utf-8')
          old = """            count: totalBought,
              type,
          });
      }
      
      return totalBought;
  }
  
  async function autoBuyFertilizerViaMall"""
          new = """            count: totalBought,
              type: 'organic',
          });
      }
      
      return totalBought;
  }
  
  async function autoBuyFertilizerViaMall"""
          assert mall.count(old) == 1, 'mall organic success log anchor changed'
          mall = mall.replace(old, new, 1)
          mall_path.write_text(mall, encoding='utf-8')

          test_path = Path('core/scripts/friend-mall-runtime-selftest.js')
          test_path.write_text(r'''const assert = require('node:assert/strict');

const networkPath = require.resolve('../src/utils/network');
const friendPath = require.resolve('../src/services/friend');
const mallPath = require.resolve('../src/services/mall');
const network = require(networkPath);
const { types } = require('../src/utils/proto');

async function testFriendApplicationsRpc() {
    const originalSendMsgAsync = network.sendMsgAsync;
    let calls = 0;
    try {
        network.sendMsgAsync = async (service, method, body) => {
            calls += 1;
            assert.equal(service, 'gamepb.friendpb.FriendService');
            assert.equal(method, 'GetApplications');
            types.GetApplicationsRequest.decode(body);
            const reply = types.GetApplicationsReply.create({
                applications: [{ gid: 12345, name: '测试好友', level: 9 }],
                block_applications: false,
            });
            return { body: types.GetApplicationsReply.encode(reply).finish() };
        };

        delete require.cache[friendPath];
        const { getApplications } = require(friendPath);
        assert.equal(typeof getApplications, 'function');
        const reply = await getApplications();
        assert.equal(calls, 1);
        assert.equal(reply.applications.length, 1);
        assert.equal(Number(reply.applications[0].gid), 12345);
        assert.equal(reply.applications[0].name, '测试好友');
    } finally {
        network.sendMsgAsync = originalSendMsgAsync;
        delete require.cache[friendPath];
    }
}

async function testOrganicMallPurchaseSuccessPath() {
    const originalSendMsgAsync = network.sendMsgAsync;
    const originalGetUserState = network.getUserState;
    let purchaseCalls = 0;
    try {
        network.getUserState = () => ({ ticket: 1 });
        network.sendMsgAsync = async (service, method, body) => {
            assert.equal(service, 'gamepb.mallpb.MallService');
            if (method === 'GetMallListBySlotType') {
                const request = types.GetMallListBySlotTypeRequest.decode(body);
                assert.equal(request.slot_type, 1);
                const goods = types.MallGoods.create({
                    goods_id: 1002,
                    name: '有机化肥',
                    price: Buffer.from([0x10, 0x01]),
                });
                const reply = types.GetMallListBySlotTypeResponse.create({
                    goods_list: [types.MallGoods.encode(goods).finish()],
                });
                return { body: types.GetMallListBySlotTypeResponse.encode(reply).finish() };
            }
            if (method === 'Purchase') {
                const request = types.PurchaseRequest.decode(body);
                assert.equal(request.goods_id, 1002);
                assert.equal(request.count, 1);
                purchaseCalls += 1;
                const reply = types.PurchaseResponse.create({ goods_id: 1002, count: 1 });
                return { body: types.PurchaseResponse.encode(reply).finish() };
            }
            throw new Error(`unexpected mall method: ${method}`);
        };

        delete require.cache[mallPath];
        const mall = require(mallPath);
        const bought = await mall.autoBuyOrganicFertilizer(true);
        assert.equal(bought, 1);
        assert.equal(purchaseCalls, 1);
    } finally {
        network.sendMsgAsync = originalSendMsgAsync;
        network.getUserState = originalGetUserState;
        delete require.cache[mallPath];
    }
}

async function main() {
    console.log('FAR2 Friend Applications + Mall Purchase Runtime Regression Self-Test');
    console.log('安全: 使用真实 protobuf + fake sendMsgAsync，不连接 QQ、不进行真实购买。\n');
    await testFriendApplicationsRpc();
    console.log('✅ pending friend applications GetApplications RPC PASS');
    await testOrganicMallPurchaseSuccessPath();
    console.log('✅ organic fertilizer successful purchase path PASS');
    console.log('\n=== RESULT ===');
    console.log(JSON.stringify({
        ok: true,
        realQqTouched: false,
        realPurchaseTouched: false,
        friendApplicationsRpcCovered: true,
        organicPurchaseSuccessCovered: true,
    }, null, 2));
}

main().catch((error) => {
    console.error('\n❌ Friend/Mall Runtime Regression Self-Test FAIL:', error && error.stack ? error.stack : error);
    process.exitCode = 1;
});
''', encoding='utf-8')

          package_path = Path('core/package.json')
          package_text = package_path.read_text(encoding='utf-8')
          script_anchor = '    "friend:mutation-selftest": "node scripts/friend-mutation-readonly-selftest.js",\n'
          assert package_text.count(script_anchor) == 1, 'package script anchor changed'
          package_text = package_text.replace(
              script_anchor,
              script_anchor + '    "friend:mall-runtime-selftest": "node scripts/friend-mall-runtime-selftest.js",\n',
              1,
          )
          regression_anchor = '&& pnpm friend:mutation-selftest && pnpm bag:use-ux-selftest'
          assert package_text.count(regression_anchor) == 1, 'regression chain anchor changed'
          package_text = package_text.replace(
              regression_anchor,
              '&& pnpm friend:mutation-selftest && pnpm friend:mall-runtime-selftest && pnpm bag:use-ux-selftest',
              1,
          )
          package_path.write_text(package_text, encoding='utf-8')
          PY
      - name: Run targeted runtime regression
        run: pnpm -C core friend:mall-runtime-selftest
      - name: Require zero no-undef in friend and mall
        shell: bash
        run: |
          set +e
          pnpm -C core exec eslint src/services/friend.js src/services/mall.js --format json > /tmp/eslint.json
          set -e
          node - <<'NODE'
          const fs = require('fs')
          const reports = JSON.parse(fs.readFileSync('/tmp/eslint.json', 'utf8'))
          const rows = reports.flatMap(report => report.messages
              .filter(message => message.ruleId === 'no-undef')
              .map(message => `${report.filePath}:${message.line}:${message.column} ${message.message}`))
          if (rows.length) {
              console.error(rows.join('\n'))
              process.exit(1)
          }
          console.log('NO_UNDEF_TOTAL=0')
          NODE
      - name: Verify repository
        run: pnpm verify
      - name: Diff integrity
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain pnpm-lock.yaml)"
          git status --short
      - name: Commit verified product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/services/friend.js core/src/services/mall.js core/scripts/friend-mall-runtime-selftest.js core/package.json
          git commit -m "fix(runtime): repair friend applications and mall success path"
          git push origin HEAD:fix/phase4-batch3-runtime-no-undef-20260915
