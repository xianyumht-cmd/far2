name: Phase4 Batch7 Apply

on:
  push:
    branches:
      - chore/phase4-batch7-user-store-dead-code-20260915
    paths:
      - .github/workflows/phase4-batch7-apply.yml
      - .github/scripts/phase4-batch7-apply.py

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply user-store dead-code cleanup
        run: python3 .github/scripts/phase4-batch7-apply.py
      - name: Verify repository
        run: pnpm verify
      - name: Diff integrity
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain pnpm-lock.yaml)"
          git status --short
      - name: Commit verified product change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/models/user-store.js
          git commit -m "chore(quality): remove unreachable user-store helpers"
          git push origin HEAD:chore/phase4-batch7-user-store-dead-code-20260915
