name: P7D pet shop safe purchase

on:
  push:
    branches:
      - feat/p7d-pet-shop-safe-purchase-20260813

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Normalize P7D UI anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/p7d_pet_shop_patch.py')
          s = p.read_text(encoding='utf-8')
          old = """function conditionText(condition: { type: number, param: number }) {\n    if (condition.type === 1)\n        return `Lv${condition.param}`\n    if (condition.type === 2)\n        return '需解锁卡'\n    return `条件${condition.type}:${condition.param}`\n}\n\nfunction clearActionState() {\n"""
          new = """function conditionText(condition: { type: number, param: number }) {\n  if (condition.type === 1)\n    return `Lv${condition.param}`\n  if (condition.type === 2)\n    return '需解锁卡'\n  return `条件${condition.type}:${condition.param}`\n}\n\nfunction clearActionState() {\n"""
          if old not in s:
              raise SystemExit('expected P7D conditionText script anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply exact P7D patch
        run: python3 .github/scripts/p7d_pet_shop_patch.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify catalog safety and Web build
        run: |
          pnpm catalog:actions-selftest
          pnpm build:web
          node --check core/src/services/catalog.js
          node --check core/src/controllers/catalog-api.js
          git diff --check
      - name: Commit verified source only
        shell: bash
        run: |
          rm .github/scripts/p7d_pet_shop_patch.py .github/workflows/p7d-pet-shop-validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/services/catalog.js core/src/controllers/catalog-api.js core/scripts/catalog-actions-selftest.js web/src/views/Catalog.vue
          git add -u .github/scripts/p7d_pet_shop_patch.py .github/workflows/p7d-pet-shop-validate.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: add safe pet shop purchase flow"
          git push origin HEAD:${GITHUB_REF_NAME}
