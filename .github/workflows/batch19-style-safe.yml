name: Batch 19 Targeted Style Fixes

on:
  push:
    branches:
      - chore/phase4-batch19-style-safe-20260915
    paths:
      - .github/workflows/batch19-style-safe.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/phase4-batch19-style-safe-20260915
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply only the 22 audited style fixes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'
          import { createRequire } from 'node:module'

          const repoRoot = process.cwd()
          const webRoot = path.join(repoRoot, 'web')
          const requireFromWeb = createRequire(path.join(webRoot, 'package.json'))
          const eslintPath = requireFromWeb.resolve('eslint')
          const { ESLint } = await import(`file://${eslintPath.replaceAll('\\', '/')}`)

          const targets = [
            'src/components/CareerPanel.vue',
            'src/components/FarmPanel.vue',
            'src/views/Activities.vue',
            'src/views/AdminPanel.vue',
            'src/views/Settings.vue',
          ]
          const allowedRules = new Set([
            'style/member-delimiter-style',
            'style/quote-props',
            'style/comma-dangle',
          ])
          const expected = new Map([
            ['style/member-delimiter-style', 10],
            ['style/quote-props', 10],
            ['style/comma-dangle', 2],
          ])

          const eslint = new ESLint({ cwd: webRoot, fix: false })
          const results = await eslint.lintFiles(targets)
          const fixesByFile = new Map()
          const counts = new Map()

          for (const result of results) {
            for (const message of result.messages) {
              if (!allowedRules.has(message.ruleId)) continue
              if (!message.fix?.range || typeof message.fix.text !== 'string') {
                throw new Error(`Selected finding is not safely autofixable: ${result.filePath}:${message.line}:${message.column} ${message.ruleId}`)
              }
              counts.set(message.ruleId, (counts.get(message.ruleId) || 0) + 1)
              const list = fixesByFile.get(result.filePath) || []
              list.push({
                ruleId: message.ruleId,
                line: message.line,
                column: message.column,
                range: message.fix.range,
                text: message.fix.text,
              })
              fixesByFile.set(result.filePath, list)
            }
          }

          for (const [rule, count] of expected) {
            const actual = counts.get(rule) || 0
            if (actual !== count) throw new Error(`Expected ${count} ${rule} findings, found ${actual}; refusing to edit`)
          }
          const total = [...counts.values()].reduce((a, b) => a + b, 0)
          if (total !== 22) throw new Error(`Expected exactly 22 selected fixes, found ${total}`)

          for (const [filePath, fixes] of fixesByFile) {
            let source = fs.readFileSync(filePath, 'utf8')
            fixes.sort((a, b) => b.range[0] - a.range[0] || b.range[1] - a.range[1])
            let lastStart = Infinity
            for (const fix of fixes) {
              const [start, end] = fix.range
              if (end > lastStart) throw new Error(`Overlapping selected fixes in ${filePath}`)
              source = source.slice(0, start) + fix.text + source.slice(end)
              lastStart = start
            }
            fs.writeFileSync(filePath, source)
            console.log(`${path.relative(repoRoot, filePath)}: applied ${fixes.length}`)
          }

          console.log(`Applied exactly ${total} audited style fixes`)
          NODE
      - name: Confirm selected findings are gone
        run: |
          node --input-type=module <<'NODE'
          import path from 'node:path'
          import { createRequire } from 'node:module'
          const repoRoot = process.cwd()
          const webRoot = path.join(repoRoot, 'web')
          const requireFromWeb = createRequire(path.join(webRoot, 'package.json'))
          const eslintPath = requireFromWeb.resolve('eslint')
          const { ESLint } = await import(`file://${eslintPath.replaceAll('\\', '/')}`)
          const targets = [
            'src/components/CareerPanel.vue',
            'src/components/FarmPanel.vue',
            'src/views/Activities.vue',
            'src/views/AdminPanel.vue',
            'src/views/Settings.vue',
          ]
          const selected = new Set(['style/member-delimiter-style','style/quote-props','style/comma-dangle'])
          const eslint = new ESLint({ cwd: webRoot, fix: false })
          const results = await eslint.lintFiles(targets)
          const leftovers = results.flatMap(r => r.messages.filter(m => selected.has(m.ruleId)).map(m => `${r.filePath}:${m.line}:${m.column} ${m.ruleId}`))
          if (leftovers.length) throw new Error(`Selected findings remain:\n${leftovers.join('\n')}`)
          console.log('Selected Batch 19 findings: 0 remaining')
          NODE
      - name: Verify repository
        run: pnpm verify
      - name: Commit targeted fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/components/CareerPanel.vue web/src/components/FarmPanel.vue web/src/views/Activities.vue web/src/views/AdminPanel.vue web/src/views/Settings.vue
          git diff --cached --check
          git diff --cached --stat
          git commit -m "chore(web): clear batch 19 safe style debt"
          git push origin HEAD:chore/phase4-batch19-style-safe-20260915
