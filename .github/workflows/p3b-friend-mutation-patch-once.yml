name: P3B friend mutation source patch

on:
  push:
    branches:
      - feat/p3b-friend-mutation-readonly-20260813

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p3b-friend-mutation-readonly-20260813

      - name: Apply exact P3B source patch
        run: |
          python scripts/p3b-friend-mutation-patch-once.py
          node --check core/src/services/friend.js
          node --check core/scripts/friend-mutation-readonly-selftest.js
          git diff --check

      - name: Commit only intended source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/services/friend.js core/package.json package.json
          git rm scripts/p3b-friend-mutation-patch-once.py .github/workflows/p3b-friend-mutation-patch-once.yml
          git commit -m "feat: expose friend land mutation details"
          git push origin HEAD:feat/p3b-friend-mutation-readonly-20260813
