name: P7C guard dog help priority

on:
  push:
    branches:
      - feat/p7c-guard-dog-help-priority-20260813

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Scope the duplicate help anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/patch-p7c-guard-dog-help.py')
          s = p.read_text(encoding='utf-8')
          old = '''s = replace_once(
              s,
              "        const allowByExp = (!stopWhenExpLimit) || (canGetExpByCandidates(op.expIds) && canGetHelpExp);\\n",
              "        const allowByExp = continueAfterExpLimit || (!stopWhenExpLimit) || (canGetExpByCandidates(op.expIds) && canGetHelpExp);\\n",
              'visitFriendForHelp exp allow',
          )'''
          new = '''friend_help_start = s.find("async function visitFriendForHelp(")
          if friend_help_start < 0:
              raise SystemExit('visitFriendForHelp exp allow: function anchor missing')
          friend_help_end = s.find("// ============ 好友巡查主循环 ============", friend_help_start)
          if friend_help_end < 0:
              raise SystemExit('visitFriendForHelp exp allow: end anchor missing')
          friend_help_block = s[friend_help_start:friend_help_end]
          old_allow = "        const allowByExp = (!stopWhenExpLimit) || (canGetExpByCandidates(op.expIds) && canGetHelpExp);\\n"
          new_allow = "        const allowByExp = continueAfterExpLimit || (!stopWhenExpLimit) || (canGetExpByCandidates(op.expIds) && canGetHelpExp);\\n"
          if friend_help_block.count(old_allow) != 1:
              raise SystemExit(f'visitFriendForHelp exp allow: expected 1 scoped match, got {friend_help_block.count(old_allow)}')
          friend_help_block = friend_help_block.replace(old_allow, new_allow, 1)
          s = s[:friend_help_start] + friend_help_block + s[friend_help_end:]'''
          if s.count(old) != 1:
              raise SystemExit(f'patch-script anchor expected 1 match, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply exact P7C patch
        run: python3 scripts/patch-p7c-guard-dog-help.py
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Validate P7C
        run: |
          pnpm friend:dog-help-selftest
          pnpm friend:dog-probe-selftest
          pnpm build:web
          node --check core/src/services/friend-dog-state.js
          node --check core/src/services/friend.js
          git diff --check
      - name: Commit only intended source changes
        run: |
          rm -f scripts/patch-p7c-guard-dog-help.py .github/workflows/p7c-guard-dog-help.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            core/src/services/friend-dog-state.js \
            core/src/services/friend.js \
            core/scripts/friend-dog-help-priority-selftest.js \
            core/package.json \
            package.json \
            web/src/stores/friend.ts \
            web/src/views/Friends.vue \
            scripts/patch-p7c-guard-dog-help.py \
            .github/workflows/p7c-guard-dog-help.yml
          git commit -m "feat: prioritize guard dog friend help" || true
          git push
