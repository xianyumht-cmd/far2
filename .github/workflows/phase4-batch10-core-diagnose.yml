name: Phase4 Batch10 Core Diagnose

on:
  push:
    branches:
      - chore/phase4-batch10-core-diagnose-20260915

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Inventory Core lint
        shell: bash
        run: |
          set +e
          pnpm -C core exec eslint . --format json > /tmp/core-lint.json
          core_status=$?
          set -e
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const rows = JSON.parse(fs.readFileSync('/tmp/core-lint.json', 'utf8'));
          const msgs = [];
          for (const row of rows) {
            const rel = path.relative(process.cwd(), row.filePath).replaceAll('\\', '/');
            for (const m of row.messages || []) {
              if (m.ruleId) msgs.push({ file: rel, rule: m.ruleId, fix: !!m.fix, line: m.line, column: m.column, message: m.message });
            }
          }
          const byRule = new Map();
          const byFile = new Map();
          for (const m of msgs) {
            const r = byRule.get(m.rule) || { total: 0, fixable: 0 };
            r.total += 1; if (m.fix) r.fixable += 1; byRule.set(m.rule, r);
            const f = byFile.get(m.file) || { total: 0, fixable: 0, rules: new Map() };
            f.total += 1; if (m.fix) f.fixable += 1; f.rules.set(m.rule, (f.rules.get(m.rule) || 0) + 1); byFile.set(m.file, f);
          }
          console.log(`CORE total=${msgs.length} fixable=${msgs.filter(m => m.fix).length} files=${byFile.size}`);
          console.log('=== RULES ===');
          for (const [rule, v] of [...byRule].sort((a,b)=>b[1].total-a[1].total || a[0].localeCompare(b[0]))) {
            console.log(`${String(v.total).padStart(3)} fix=${String(v.fixable).padStart(3)} ${rule}`);
          }
          console.log('=== FILES ===');
          for (const [fileName, v] of [...byFile].sort((a,b)=>b[1].total-a[1].total || a[0].localeCompare(b[0]))) {
            const rules = [...v.rules].sort((a,b)=>b[1]-a[1]).map(([r,c])=>`${r}:${c}`).join(', ');
            console.log(`${String(v.total).padStart(3)} fix=${String(v.fixable).padStart(3)} ${fileName} [${rules}]`);
          }
          console.log('=== LOW-RISK DETAIL (<=12 findings) ===');
          for (const [fileName, v] of [...byFile].filter(([,v]) => v.total <= 12).sort((a,b)=>a[1].total-b[1].total || a[0].localeCompare(b[0]))) {
            console.log(`-- ${fileName} total=${v.total} fixable=${v.fixable}`);
            for (const m of msgs.filter(x => x.file === fileName)) console.log(`  ${m.line}:${m.column} ${m.fix ? 'FIX' : 'NOFIX'} ${m.rule} :: ${m.message}`);
          }
          NODE
          echo "core eslint exit=$core_status"
