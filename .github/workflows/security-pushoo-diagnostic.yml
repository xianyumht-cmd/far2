name: Pushoo Security Diagnostic

on:
  push:
    branches: [diag/security-pushoo-metadata-20260917]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Inspect repository and pushoo usage
        shell: bash
        run: |
          set -euo pipefail
          echo '=== CURRENT DECLARATION ==='
          node -e "console.log(require('./core/package.json').dependencies.pushoo)"
          echo '=== INSTALLED PUS HOO PACKAGE ==='
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('core/node_modules/pushoo/package.json', 'utf8'));
          console.log(JSON.stringify({name:pkg.name,version:pkg.version,main:pkg.main,exports:pkg.exports,engines:pkg.engines,dependencies:pkg.dependencies,repository:pkg.repository}, null, 2));
          NODE
          echo '=== REGISTRY LATEST ==='
          pnpm view pushoo@latest version dependencies engines repository dist-tags --json
          echo '=== FAR2 DIRECT PUS HOO TEXT USAGE (excluding manifests, lockfile, node_modules) ==='
          grep -RIni \
            --exclude='package.json' \
            --exclude='pnpm-lock.yaml' \
            --exclude-dir='.git' \
            --exclude-dir='node_modules' \
            'pushoo' . || true
          echo '=== FAR2 EXPORTED NOTICE NAME USAGE ==='
          grep -RInE \
            --exclude='package.json' \
            --exclude='pnpm-lock.yaml' \
            --exclude-dir='.git' \
            --exclude-dir='node_modules' \
            'notice(Qmsg|ServerChan|PushPlus|PushPlusHxtrip|DingTalk|WeCom|Bark|GoCqhttp|NodeOnebot|Atri|Pushdeer|Igot|Telegram|Feishu|Ifttt|Wecombot|Discord|WxPusher|Join)?' \
            core web || true
          echo '=== PUS HOO INTERNAL LODASH USAGE ==='
          grep -RIni --include='*.js' 'lodash' core/node_modules/pushoo/dist || true
          echo '=== PUS HOO INTERNAL AXIOS USAGE SUMMARY ==='
          grep -RIn --include='*.js' 'axios_1' core/node_modules/pushoo/dist | head -120 || true
          echo '=== PUS HOO PACKAGE FILES ==='
          find -L core/node_modules/pushoo -maxdepth 2 -type f -printf '%P\n' | sort | head -120
