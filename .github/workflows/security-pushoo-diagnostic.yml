name: Pushoo Security Diagnostic

on:
  push:
    branches: [diag/security-pushoo-metadata-20260917]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Inspect registry metadata and local usage
        shell: bash
        run: |
          set -euo pipefail
          echo '=== CURRENT DECLARATION ==='
          node -e "console.log(require('./core/package.json').dependencies.pushoo)"
          echo '=== INSTALLED PUS HOO PACKAGE ==='
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('core/node_modules/pushoo/package.json', 'utf8'));
          console.log(JSON.stringify({name:pkg.name,version:pkg.version,main:pkg.main,exports:pkg.exports,engines:pkg.engines,dependencies:pkg.dependencies,repository:pkg.repository}, null, 2));
          NODE
          echo '=== REGISTRY CURRENT VERSION ==='
          pnpm view pushoo@0.1.11 version dependencies engines repository --json
          echo '=== REGISTRY LATEST ==='
          pnpm view pushoo@latest version dependencies engines repository dist-tags --json
          echo '=== ALL VERSIONS ==='
          pnpm view pushoo versions --json
          echo '=== REPOSITORY USAGE (excluding manifests/lock) ==='
          rg -n -i 'pushoo' . --glob '!pnpm-lock.yaml' --glob '!**/package.json' --glob '!node_modules/**' --glob '!**/node_modules/**' || true
          echo '=== PACKAGE FILES ==='
          find core/node_modules/pushoo -maxdepth 2 -type f -printf '%P\n' | sort | head -80
          echo '=== PACKAGE ENTRYPOINT ==='
          entry=$(node -e "const p=require('./core/node_modules/pushoo/package.json'); console.log(p.main||'index.js')")
          sed -n '1,260p' "core/node_modules/pushoo/$entry"
