name: P7B friend dog probe validation

on:
  push:
    branches:
      - feat/p7b-friend-dog-probe-20260813

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p7b-friend-dog-probe-20260813

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate P7B
        run: |
          pnpm friend:dog-probe-selftest
          pnpm friend:mutation-selftest
          pnpm build:web
          node --check core/src/services/friend-dog-probe.js
          node --check core/src/services/friend.js
          git diff --check
