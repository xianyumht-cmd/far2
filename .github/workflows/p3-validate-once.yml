name: P3 mutation read-only validation

on:
  push:
    branches:
      - feat/p3-mutation-readonly-20260813

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p3-mutation-readonly-20260813

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate mutation read-only feature
        run: |
          pnpm mutation:readonly-selftest
          pnpm build:web
          node --check core/src/config/gameConfig.js
          node --check core/src/services/farm-mutation.js
          node --check core/src/services/farm.js
          git diff --check
