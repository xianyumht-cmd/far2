name: Phase4 Batch6 Apply

on:
  push:
    branches:
      - chore/phase4-batch6-literal-case-20260915
    paths:
      - .github/workflows/phase4-batch6-apply.yml
      - .github/scripts/phase4-batch6-rule-fixes.cjs

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exactly 13 targeted lint fixes
        run: node .github/scripts/phase4-batch6-rule-fixes.cjs
      - name: Verify repository
        run: pnpm verify
      - name: Diff integrity
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain pnpm-lock.yaml)"
          git status --short
      - name: Commit verified product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            core/scripts/qq-activity-wire-capture.js \
            core/scripts/qq-dog-addfood-wire-capture.js \
            core/scripts/qq-official-readonly-ui-capture-selftest.js \
            core/scripts/qq-official-readonly-ui-capture.js \
            core/scripts/qq-static-plant-overlay-scan.js \
            core/src/services/career.js \
            core/src/services/mystery-shop.js
          git commit -m "chore(quality): normalize core literal casing"
          git push origin HEAD:chore/phase4-batch6-literal-case-20260915
