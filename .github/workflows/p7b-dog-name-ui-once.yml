name: P7B dog name UI one-shot

on:
  push:
    branches:
      - feat/p7b-friend-dog-name-ui-20260813

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p7b-friend-dog-name-ui-20260813

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Apply exact UI patch
        run: python .github/patch-p7b-dog-name-ui.py

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate UI
        run: |
          pnpm build:web
          git diff --check

      - name: Commit only intended source changes
        run: |
          rm .github/patch-p7b-dog-name-ui.py
          rm .github/workflows/p7b-dog-name-ui-once.yml
          git config user.name "xianyumht-cmd"
          git config user.email "xianyumht@gmail.com"
          git add web/src/views/Friends.vue
          git add -u .github/patch-p7b-dog-name-ui.py .github/workflows/p7b-dog-name-ui-once.yml
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
          else
            git commit -m "feat: label confirmed friend dog ids"
            git push origin HEAD:feat/p7b-friend-dog-name-ui-20260813
          fi
