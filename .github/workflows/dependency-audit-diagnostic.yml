name: Diagnose Dependency Audit

on:
  push:
    branches: [diag/dependency-audit-20260916]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production dependency audit
        shell: bash
        run: |
          set +e
          pnpm audit --prod --audit-level low
          code=$?
          echo "PROD_AUDIT_EXIT=$code"
          exit 0
      - name: Full dependency audit
        shell: bash
        run: |
          set +e
          pnpm audit --audit-level low
          code=$?
          echo "FULL_AUDIT_EXIT=$code"
          exit 0
