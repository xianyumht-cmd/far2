name: P6A farm land analyzer source patch

on:
  push:
    branches:
      - refactor/p6a-farm-land-analyzer-20260813

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/p6a-farm-land-analyzer-20260813
          fetch-depth: 1

      - name: Apply P6A extraction
        run: python3 scripts/p6a-land-analyzer-patch-once.py

      - name: Source checks
        run: |
          node --check core/src/services/farm-land-analyzer.js
          node --check core/src/services/farm.js
          node --check core/scripts/farm-land-analyzer-selftest.js
          git diff --check

      - name: Commit only P6A source files
        run: |
          rm -f .github/workflows/p6a-land-analyzer-patch-once.yml scripts/p6a-land-analyzer-patch-once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/services/farm.js core/package.json package.json
          git add -u .github/workflows/p6a-land-analyzer-patch-once.yml scripts/p6a-land-analyzer-patch-once.py
          git commit -m "refactor: use extracted farm land analyzer"
          git push origin HEAD:refactor/p6a-farm-land-analyzer-20260813
