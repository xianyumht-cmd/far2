name: Batch 24 Async Wait Loop Cleanup

on:
  push:
    branches: [fix/phase4-batch24-async-wait-loops-20260915]
    paths: [.github/workflows/batch24-async-wait-loops.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/phase4-batch24-async-wait-loops-20260915
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact audited async-wait rewrites
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          function replaceOnce(source, from, to, label) {
            const first = source.indexOf(from)
            if (first < 0) throw new Error(`Missing expected block: ${label}`)
            if (source.indexOf(from, first + from.length) >= 0) throw new Error(`Expected unique block: ${label}`)
            return source.slice(0, first) + to + source.slice(first + from.length)
          }

          const selftestPath = 'core/scripts/farm-orchestrator-selftest.js'
          let selftest = fs.readFileSync(selftestPath, 'utf8')
          selftest = replaceOnce(
            selftest,
            "    let entered = false;\n",
            "    let resolveEntered;\n    const entered = new Promise((resolve) => { resolveEntered = resolve; });\n",
            'selftest entered state',
          )
          selftest = replaceOnce(
            selftest,
            "            entered = true;\n            await gate;\n",
            "            resolveEntered();\n            await gate;\n",
            'selftest entered signal',
          )
          selftest = replaceOnce(
            selftest,
            "    const firstCheck = busyOrchestrator.checkFarm();\n    while (!entered) await new Promise((resolve) => setImmediate(resolve));\n",
            "    const firstCheck = busyOrchestrator.checkFarm();\n    await entered;\n",
            'selftest polling wait',
          )
          fs.writeFileSync(selftestPath, selftest)

          const nativePath = 'core/src/services/wechat-wmpf-native-capture.js'
          let native = fs.readFileSync(nativePath, 'utf8')
          native = replaceOnce(
            native,
            "    const deadline = Date.now() + 3000;\n    while (!hookReady && !hookError && Date.now() < deadline) await sleep(30);\n",
            "    const deadline = Date.now() + 3000;\n    for (;;) {\n        if (hookReady || hookError || Date.now() >= deadline) break;\n        await sleep(30);\n    }\n",
            'native hook readiness wait',
          )
          fs.writeFileSync(nativePath, native)

          const residentPath = 'core/src/services/wechat-wmpf-resident-capture.js'
          let resident = fs.readFileSync(residentPath, 'utf8')
          resident = replaceOnce(
            resident,
            "    const deadline = Date.now() + 3000;\n    while (!ready && !hookError && Date.now() < deadline) await sleep(30);\n",
            "    const deadline = Date.now() + 3000;\n    for (;;) {\n        if (ready || hookError || Date.now() >= deadline) break;\n        await sleep(30);\n    }\n",
            'resident hook readiness wait',
          )
          fs.writeFileSync(residentPath, resident)

          console.log('Applied Batch 24 async wait-loop rewrites')
          NODE
      - name: Validate lint target and exact behavior shape
        run: |
          node --input-type=module <<'NODE'
          import path from 'node:path'
          import { createRequire } from 'node:module'
          const root = process.cwd()
          async function lint(workspace, targets) {
            const cwd = path.join(root, workspace)
            const req = createRequire(path.join(cwd, 'package.json'))
            const { ESLint } = await import(`file://${req.resolve('eslint').replaceAll('\\', '/')}`)
            return new ESLint({ cwd, fix: false }).lintFiles(targets)
          }
          const reports = [...await lint('core', ['.']), ...await lint('web', ['src/**/*.{ts,vue}'])]
          let total = 0
          let target = 0
          for (const report of reports) {
            for (const message of report.messages || []) {
              if (!message.severity) continue
              total++
              if (message.ruleId === 'no-unmodified-loop-condition') target++
            }
          }
          if (target !== 0) throw new Error(`Expected no-unmodified-loop-condition=0, got ${target}`)
          if (total !== 535) throw new Error(`Expected total lint findings 535 after Batch 24, got ${total}`)
          console.log('Batch 24 lint target PASS: total 535; no-unmodified-loop-condition 0')
          NODE
      - name: Verify repository
        run: pnpm verify
      - name: Commit audited changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/scripts/farm-orchestrator-selftest.js core/src/services/wechat-wmpf-native-capture.js core/src/services/wechat-wmpf-resident-capture.js
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(core): make async wait loops explicit"
          git push origin HEAD:fix/phase4-batch24-async-wait-loops-20260915
