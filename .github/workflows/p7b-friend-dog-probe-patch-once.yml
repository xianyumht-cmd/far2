name: P7B friend dog probe source patch

on:
  push:
    branches:
      - feat/p7b-friend-dog-probe-20260813

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p7b-friend-dog-probe-20260813

      - name: Apply exact P7B source patch
        run: |
          python scripts/p7b-friend-dog-probe-patch-once.py
          node --check core/src/services/friend-dog-probe.js
          node --check core/scripts/friend-dog-probe-selftest.js
          node --check core/src/services/friend.js
          git diff --check

      - name: Commit only intended source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/services/friend.js core/package.json package.json
          git rm scripts/p7b-friend-dog-probe-patch-once.py .github/workflows/p7b-friend-dog-probe-patch-once.yml
          git commit -m "feat: preserve friend dog protocol probe"
          git push origin HEAD:feat/p7b-friend-dog-probe-20260813
