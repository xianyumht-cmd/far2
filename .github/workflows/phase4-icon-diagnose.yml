name: Phase4 Icon Cleanup Verify

on:
  push:
    branches:
      - chore/phase4-cleanup-batch2-icons-20260914
    paths:
      - .github/workflows/phase4-icon-diagnose.yml

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact icon cleanup
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          replacements = {
              'web/src/stores/app.ts': [
                  ('i-carbon-leaf', 'i-carbon-sprout', 1),
                  ('i-carbon-crown', 'i-carbon-trophy', 1),
              ],
              'web/src/router/menu.ts': [
                  ('i-carbon-health-status', 'i-carbon-crop-health', 1),
              ],
              'web/src/views/HealthCenter.vue': [
                  ('i-carbon-health-status', 'i-carbon-crop-health', 1),
              ],
              'web/src/views/Dashboard.vue': [
                  ('i-carbon-circle text-amber-500', 'i-carbon-circle-filled text-amber-500', 1),
              ],
              'web/src/views/Friends.vue': [
                  ('i-carbon-list-blocked', 'i-carbon-locked-and-blocked', 2),
                  ('i-carbon-user-offline', 'i-carbon-user-profile', 1),
              ],
              'web/src/views/Personal.vue': [
                  ('i-carbon-paw', 'i-carbon-pet-image-o', 1),
              ],
              'web/src/components/DogPanel.vue': [
                  ('i-carbon-paw', 'i-carbon-pet-image-o', 1),
              ],
              'web/src/components/FarmPanel.vue': [
                  ('i-carbon-user-offline', 'i-carbon-user-profile', 1),
              ],
              'web/src/components/TaskPanel.vue': [
                  ('i-carbon-user-offline', 'i-carbon-user-profile', 1),
              ],
          }

          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new, expected in edits:
                  actual = text.count(old)
                  if actual != expected:
                      raise SystemExit(f'{filename}: expected {expected} occurrences of {old!r}, found {actual}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          uno = Path('web/uno.config.ts')
          text = uno.read_text(encoding='utf-8')
          if 'blocklist:' in text:
              raise SystemExit('web/uno.config.ts: blocklist already exists unexpectedly')
          anchor = 'export default defineConfig({\n'
          if text.count(anchor) != 1:
              raise SystemExit('web/uno.config.ts: defineConfig anchor mismatch')
          block = ''.join([
              "  blocklist: [\n",
              "    'i-carbon-circle-dash-function',\n",
              "    'i-carbon-circle-dash-string',\n",
              "    'i-carbon-circle-dash-return',\n",
              "    'i-carbon-renew-animate-spin',\n",
              "    'i-carbon-restart-animate-spin',\n",
              "  ],\n",
          ])
          text = text.replace(anchor, anchor + block, 1)
          uno.write_text(text, encoding='utf-8')
          PY
      - name: Verify Carbon replacements exist
        shell: bash
        working-directory: web
        run: |
          node <<'NODE'
          const { icons } = require('@iconify-json/carbon')
          for (const name of ['sprout','trophy','crop-health','circle-filled','locked-and-blocked','pet-image-o','user-profile','circle-dash','renew','restart']) {
            if (!Object.hasOwn(icons.icons, name)) throw new Error(`Missing Carbon icon: ${name}`)
          }
          console.log('Carbon replacement icons: PASS')
          NODE
      - name: Require warning-free Web build
        shell: bash
        run: |
          set -o pipefail
          pnpm -C web build 2>&1 | tee /tmp/web-build.log
          if grep -F '[unocss] failed to load icon' /tmp/web-build.log; then
            echo 'UnoCSS icon warnings remain.' >&2
            exit 1
          fi
      - name: Run canonical verification
        run: pnpm verify
      - name: Integrity checks
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --short -- pnpm-lock.yaml core/pnpm-lock.yaml web/pnpm-lock.yaml)"
          git status --short
      - name: Commit verified product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            web/uno.config.ts \
            web/src/stores/app.ts \
            web/src/router/menu.ts \
            web/src/views/HealthCenter.vue \
            web/src/views/Dashboard.vue \
            web/src/views/Friends.vue \
            web/src/views/Personal.vue \
            web/src/components/DogPanel.vue \
            web/src/components/FarmPanel.vue \
            web/src/components/TaskPanel.vue
          git commit -m 'chore(web): replace invalid Carbon icon candidates'
          git push origin HEAD:chore/phase4-cleanup-batch2-icons-20260914
