name: Phase4 Icon Diagnose

on:
  push:
    branches:
      - chore/phase4-cleanup-batch2-icons-20260914

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Locate invalid icon requests
        shell: bash
        run: |
          set -euo pipefail
          echo '=== SOURCE OCCURRENCES ==='
          for name in leaf crown health-status circle list-blocked paw user-offline circle-dash-function circle-dash-string circle-dash-return renew-animate-spin restart-animate-spin; do
            echo "--- $name ---"
            grep -RIn --exclude-dir=node_modules --exclude-dir=dist -- "i-carbon-$name\|carbon-$name" web/src web/uno.config.ts || true
          done
          echo '=== DYNAMIC / NEIGHBORING CANDIDATES ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=dist -E "i-carbon-(circle-dash|renew|restart)|getOpIcon|animate-spin" web/src || true
      - name: Inspect installed Carbon collection
        shell: bash
        working-directory: web
        run: |
          node <<'NODE'
          const { icons } = require('@iconify-json/carbon')
          const names = Object.keys(icons.icons)
          console.log('=== SEMANTIC CANDIDATES ===')
          for (const keyword of ['star','trophy','award','medal','badge','dog','pet','animal','health','status','blocked','lock','offline','user','circle','sprout','tree']) {
            const matches = names.filter(n => n.includes(keyword)).slice(0,80)
            console.log(`${keyword}: ${matches.join(',')}`)
          }
          console.log('=== EXACT CANDIDATES ===')
          for (const name of ['sprout','tree','star','star-filled','trophy','badge','crop-health','health-cross','status-resolved','circle-dash','circle-filled','circle-outline','locked-and-blocked','user','user-profile','user-avatar','user-online','renew','restart']) {
            console.log(`${name}=${Object.hasOwn(icons.icons, name)}`)
          }
          NODE
      - name: Isolate UnoCSS extraction
        shell: bash
        working-directory: web
        run: |
          node <<'NODE'
          const { createGenerator } = require('@unocss/core')
          const { presetIcons } = require('unocss')
          const samples = {
            tsFallback: "function getOpIcon(key: string | number) { return OP_META[String(key)]?.icon || 'i-carbon-circle-dash' }",
            staticSpin: '<div class="i-carbon-renew mr-2 animate-spin text-xl" />',
            boundSpin: '<div class="i-carbon-renew" :class="loading ? \'animate-spin\' : \'\'" />',
            restartBound: '<div class="i-carbon-restart" :class="loading ? \'animate-spin\' : \'\'" />',
          }
          ;(async () => {
            for (const [label, source] of Object.entries(samples)) {
              const requested = []
              const uno = await createGenerator({
                presets: [presetIcons({
                  collections: {
                    carbon: async name => {
                      requested.push(name)
                      return '<svg viewBox="0 0 16 16"></svg>'
                    },
                  },
                })],
              })
              await uno.generate(source)
              console.log(JSON.stringify({ label, requested: [...new Set(requested)] }))
            }
          })().catch(error => {
            console.error(error)
            process.exitCode = 1
          })
          NODE
      - name: Reproduce Web build warnings
        run: pnpm -C web build
