name: Batch 26 Small UnoCSS Ordering Cleanup

on:
  push:
    branches: [chore/phase4-batch26-unocss-small-20260915]
    paths: [.github/workflows/batch26-unocss-small.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/phase4-batch26-unocss-small-20260915
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply only audited small-file autofixes
        run: |
          node --input-type=module <<'NODE'
          import path from 'node:path'
          import { createRequire } from 'node:module'

          const root = process.cwd()
          const cwd = path.join(root, 'web')
          const req = createRequire(path.join(cwd, 'package.json'))
          const { ESLint } = await import(`file://${req.resolve('eslint').replaceAll('\\', '/')}`)
          const files = [
            'src/components/LandCard.vue',
            'src/components/BagPanel.vue',
            'src/components/FarmPanel.vue',
            'src/views/AdminPanel.vue',
            'src/views/Friends.vue',
          ]

          const before = await new ESLint({ cwd, fix: false }).lintFiles(files)
          let beforeTotal = 0
          let beforeUno = 0
          const beforeOther = []
          for (const report of before) {
            for (const message of report.messages || []) {
              if (!message.severity) continue
              beforeTotal++
              if (message.ruleId === 'unocss/order') beforeUno++
              else beforeOther.push(`${path.relative(root, report.filePath)}:${message.line}:${message.ruleId}`)
            }
          }
          if (beforeTotal !== 15 || beforeUno !== 15 || beforeOther.length !== 0) {
            throw new Error(`Unexpected pre-fix findings: total=${beforeTotal} unocss=${beforeUno} other=${beforeOther.join(',')}`)
          }

          const fixed = await new ESLint({ cwd, fix: true }).lintFiles(files)
          await ESLint.outputFixes(fixed)

          const after = await new ESLint({ cwd, fix: false }).lintFiles(files)
          const afterFindings = []
          for (const report of after) {
            for (const message of report.messages || []) {
              if (message.severity) afterFindings.push(`${path.relative(root, report.filePath)}:${message.line}:${message.ruleId}`)
            }
          }
          if (afterFindings.length !== 0) throw new Error(`Expected selected files clean, got ${afterFindings.join(',')}`)
          console.log('Batch 26 selected-file autofix PASS: 15 -> 0')
          NODE
      - name: Confirm repository lint total
        run: |
          node --input-type=module <<'NODE'
          import path from 'node:path'
          import { createRequire } from 'node:module'
          const root = process.cwd()
          async function lint(workspace, targets) {
            const cwd = path.join(root, workspace)
            const req = createRequire(path.join(cwd, 'package.json'))
            const { ESLint } = await import(`file://${req.resolve('eslint').replaceAll('\\', '/')}`)
            return new ESLint({ cwd, fix: false }).lintFiles(targets)
          }
          const reports = [...await lint('core', ['.']), ...await lint('web', ['src/**/*.{ts,vue}'])]
          let total = 0
          let nonBulk = 0
          const bulk = new Set(['vue/singleline-html-element-content-newline', 'unocss/order', 'vue/html-indent'])
          for (const report of reports) for (const message of report.messages || []) {
            if (!message.severity) continue
            total++
            if (!bulk.has(message.ruleId)) nonBulk++
          }
          if (total !== 506) throw new Error(`Expected total lint findings 506, got ${total}`)
          if (nonBulk !== 0) throw new Error(`Expected non-bulk findings 0, got ${nonBulk}`)
          console.log('Batch 26 repository lint PASS: total 506; non-bulk 0')
          NODE
      - name: Verify repository
        run: pnpm verify
      - name: Commit audited changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/components/LandCard.vue web/src/components/BagPanel.vue web/src/components/FarmPanel.vue web/src/views/AdminPanel.vue web/src/views/Friends.vue
          git diff --cached --check
          git diff --cached --stat
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git commit -m "chore(web): normalize small UnoCSS class ordering"
          git push origin HEAD:chore/phase4-batch26-unocss-small-20260915
