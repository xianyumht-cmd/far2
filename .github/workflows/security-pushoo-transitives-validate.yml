name: Validate Pushoo Security Overrides

on:
  push:
    branches: [chore/security-pushoo-transitives-20260917]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply narrow pushoo child overrides
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          pkg.pnpm ||= {};
          pkg.pnpm.overrides ||= {};
          pkg.pnpm.overrides['pushoo>axios'] = '0.34.0';
          pkg.pnpm.overrides['pushoo>lodash'] = '4.18.1';
          fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
          pnpm --filter qq-farm-bot list pushoo axios lodash --depth 5

      - name: Smoke test pushoo compatibility without network
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { createRequire } = require('node:module');

          function packageVersionFromEntry(entry, expectedName) {
            let dir = path.dirname(entry);
            while (true) {
              const manifest = path.join(dir, 'package.json');
              if (fs.existsSync(manifest)) {
                const pkg = JSON.parse(fs.readFileSync(manifest, 'utf8'));
                if (pkg.name === expectedName) return pkg.version;
              }
              const parent = path.dirname(dir);
              if (parent === dir) break;
              dir = parent;
            }
            throw new Error(`cannot locate ${expectedName} package.json from ${entry}`);
          }

          const coreRequire = createRequire(path.join(process.cwd(), 'core', 'package.json'));
          const pushooEntry = coreRequire.resolve('pushoo');
          const pushooRequire = createRequire(pushooEntry);
          const axiosPath = pushooRequire.resolve('axios');
          const lodashPath = pushooRequire.resolve('lodash');
          const axiosVersion = packageVersionFromEntry(axiosPath, 'axios');
          const lodashVersion = packageVersionFromEntry(lodashPath, 'lodash');
          if (axiosVersion !== '0.34.0') throw new Error(`unexpected pushoo axios ${axiosVersion}`);
          if (lodashVersion !== '4.18.1') throw new Error(`unexpected pushoo lodash ${lodashVersion}`);

          const axiosModule = require(axiosPath);
          const axios = axiosModule.default || axiosModule;
          const requests = [];
          axios.defaults.adapter = async (config) => {
            requests.push({ method: config.method, url: config.url, data: config.data });
            return {
              data: { code: 0, msg: 'ok', status: 'success' },
              status: 200,
              statusText: 'OK',
              headers: {},
              config,
              request: {},
            };
          };

          const { sendPushooMessage } = coreRequire('./src/services/push');
          (async () => {
            const webhook = await sendPushooMessage({
              channel: 'webhook',
              endpoint: 'https://example.invalid/far2-push',
              token: '',
              title: 'FAR2 smoke',
              content: 'webhook compatibility',
            });
            if (!webhook.ok) throw new Error(`webhook smoke failed: ${JSON.stringify(webhook)}`);

            const qmsg = await sendPushooMessage({
              channel: 'qmsg',
              token: 'far2-smoke-token',
              title: 'FAR2 smoke',
              content: 'qmsg compatibility',
            });
            if (!qmsg.ok) throw new Error(`qmsg smoke failed: ${JSON.stringify(qmsg)}`);

            if (requests.length !== 2) throw new Error(`expected 2 intercepted requests, got ${requests.length}`);
            if (requests.some(r => String(r.method).toLowerCase() !== 'post')) throw new Error(`unexpected request methods: ${JSON.stringify(requests)}`);
            if (requests[0].url !== 'https://example.invalid/far2-push') throw new Error(`unexpected webhook URL: ${requests[0].url}`);
            if (!String(requests[1].url).includes('qmsg')) throw new Error(`unexpected qmsg URL: ${requests[1].url}`);
            console.log(JSON.stringify({ axios: axiosVersion, lodash: lodashVersion, interceptedRequests: requests.length, networkTouched: false }));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Verify repository
        run: pnpm verify

      - name: Require zero production audit findings
        shell: bash
        run: |
          set +e
          pnpm audit --prod --json > prod-audit.json
          code=$?
          set -e
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('prod-audit.json', 'utf8'));
          const vulnerabilities = data.metadata?.vulnerabilities || {};
          console.log(JSON.stringify(vulnerabilities, null, 2));
          const total = Object.values(vulnerabilities).reduce((sum, value) => sum + Number(value || 0), 0);
          if (total !== 0) {
            const rows = [];
            for (const [id, advisory] of Object.entries(data.advisories || {})) {
              for (const finding of advisory.findings || []) {
                for (const p of finding.paths || []) rows.push({ id, module: advisory.module_name, severity: advisory.severity, version: finding.version, path: p, patched: advisory.patched_versions });
              }
            }
            console.error('Remaining production audit findings:', JSON.stringify(rows, null, 2));
            process.exit(1);
          }
          console.log('Production audit is clean: zero vulnerabilities.');
          NODE
          if [ "$code" -ne 0 ]; then
            echo "pnpm audit exited $code despite zero parsed findings" >&2
            exit "$code"
          fi

      - name: Commit production changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml
          unexpected=$(git diff --name-only --cached | grep -Ev '^(package.json|pnpm-lock.yaml)$' || true)
          if [ -n "$unexpected" ]; then echo "Unexpected files: $unexpected" >&2; exit 1; fi
          git diff --cached --check
          git diff --cached --exit-code && { echo 'No changes to commit' >&2; exit 1; } || true
          git commit -m 'chore(security): override patched pushoo transitives'
          git push
