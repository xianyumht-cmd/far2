name: Validate Docker Non-Root Runtime

on:
  push:
    branches: [chore/docker-nonroot-runtime-20260917]

permissions:
  contents: read

jobs:
  docker-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build production image
        run: docker build -f core/Dockerfile -t far2-nonroot:test .

      - name: Verify non-root runtime contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect far2-nonroot:test --format '{{.Config.User}}')" = "node"
          docker run --rm --entrypoint sh far2-nonroot:test -c '
            set -eu
            test "$(id -u)" -ne 0
            test -w /app/core/data
            test ! -w /app/core/client.js
            touch /app/core/data/.far2-write-test
            rm /app/core/data/.far2-write-test
          '

      - name: Verify named-volume write compatibility
        shell: bash
        run: |
          set -euo pipefail
          volume="far2-nonroot-${GITHUB_RUN_ID}"
          trap 'docker volume rm -f "$volume" >/dev/null 2>&1 || true' EXIT
          docker volume create "$volume" >/dev/null
          docker run --rm --entrypoint sh -v "$volume:/app/core/data" far2-nonroot:test -c '
            set -eu
            test "$(id -u)" -ne 0
            test -w /app/core/data
            mkdir -p /app/core/data/logs
            touch /app/core/data/logs/.far2-volume-write-test
            rm /app/core/data/logs/.far2-volume-write-test
          '

      - name: Validate Compose configuration
        run: docker compose config --quiet
