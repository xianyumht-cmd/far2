name: P3 mutation source patch

on:
  push:
    branches:
      - feat/p3-mutation-readonly-20260813

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p3-mutation-readonly-20260813
          fetch-depth: 1

      - name: Apply patch
        run: python3 scripts/p3-mutation-patch-once.py

      - name: Check source
        run: |
          node --check core/src/config/gameConfig.js
          node --check core/src/services/farm-mutation.js
          node --check core/src/services/farm.js
          node core/scripts/mutation-readonly-selftest.js
          git diff --check

      - name: Commit source patch
        run: |
          rm -f .github/workflows/p3-mutation-patch-once.yml scripts/p3-mutation-patch-once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/config/gameConfig.js core/src/services/farm.js web/src/components/LandCard.vue core/package.json package.json
          git add -u .github/workflows/p3-mutation-patch-once.yml scripts/p3-mutation-patch-once.py
          git commit -m "feat: expose mutation read model in farm UI"
          git push origin HEAD:feat/p3-mutation-readonly-20260813
