name: P5C activity read-only validation

on:
  push:
    branches:
      - feat/p5c-activity-readonly-framework-20260813

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p5c-activity-readonly-framework-20260813

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate P5C
        run: |
          pnpm activity:readonly-selftest
          pnpm build:web
          node --check core/src/services/activity-readonly.js
          node --check core/src/utils/proto.js
          node --check core/src/core/worker.js
          node --check core/src/runtime/data-provider.js
          node --check core/src/controllers/admin.js
          git diff --check
