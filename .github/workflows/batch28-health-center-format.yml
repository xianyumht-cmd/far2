name: Batch 28 Health Center Formatting Cleanup

on:
  push:
    branches: [chore/phase4-batch28-health-center-format-20260915]
    paths: [.github/workflows/batch28-health-center-format.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/phase4-batch28-health-center-format-20260915
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply audited single-file autofix
        run: |
          node --input-type=module <<'NODE'
          import path from 'node:path'
          import { createRequire } from 'node:module'

          const root = process.cwd()
          const cwd = path.join(root, 'web')
          const req = createRequire(path.join(cwd, 'package.json'))
          const { ESLint } = await import(`file://${req.resolve('eslint').replaceAll('\\', '/')}`)
          const file = 'src/views/HealthCenter.vue'
          const allowed = new Set(['vue/singleline-html-element-content-newline', 'unocss/order'])

          const before = await new ESLint({ cwd, fix: false }).lintFiles([file])
          let total = 0
          const counts = new Map()
          const unexpected = []
          for (const report of before) for (const message of report.messages || []) {
            if (!message.severity) continue
            total++
            counts.set(message.ruleId, (counts.get(message.ruleId) || 0) + 1)
            if (!allowed.has(message.ruleId)) unexpected.push(`${message.line}:${message.ruleId}`)
          }
          if (total !== 40) throw new Error(`Expected 40 pre-fix findings, got ${total}`)
          if ((counts.get('vue/singleline-html-element-content-newline') || 0) !== 26) throw new Error('Unexpected singleline count')
          if ((counts.get('unocss/order') || 0) !== 14) throw new Error('Unexpected unocss count')
          if (unexpected.length) throw new Error(`Unexpected rules: ${unexpected.join(',')}`)

          const fixed = await new ESLint({ cwd, fix: true }).lintFiles([file])
          await ESLint.outputFixes(fixed)

          const after = await new ESLint({ cwd, fix: false }).lintFiles([file])
          const remaining = after.flatMap(report => (report.messages || []).filter(message => message.severity).map(message => `${message.line}:${message.ruleId}`))
          if (remaining.length) throw new Error(`Expected file clean, got ${remaining.join(',')}`)
          console.log('Batch 28 selected-file autofix PASS: 40 -> 0')
          NODE
      - name: Confirm repository lint total
        run: |
          node --input-type=module <<'NODE'
          import path from 'node:path'
          import { createRequire } from 'node:module'
          const root = process.cwd()
          async function lint(workspace, targets) {
            const cwd = path.join(root, workspace)
            const req = createRequire(path.join(cwd, 'package.json'))
            const { ESLint } = await import(`file://${req.resolve('eslint').replaceAll('\\', '/')}`)
            return new ESLint({ cwd, fix: false }).lintFiles(targets)
          }
          const reports = [...await lint('core', ['.']), ...await lint('web', ['src/**/*.{ts,vue}'])]
          const bulk = new Set(['vue/singleline-html-element-content-newline', 'unocss/order', 'vue/html-indent'])
          let total = 0
          let nonBulk = 0
          for (const report of reports) for (const message of report.messages || []) {
            if (!message.severity) continue
            total++
            if (!bulk.has(message.ruleId)) nonBulk++
          }
          if (total !== 429) throw new Error(`Expected total lint findings 429, got ${total}`)
          if (nonBulk !== 0) throw new Error(`Expected non-bulk findings 0, got ${nonBulk}`)
          console.log('Batch 28 repository lint PASS: total 429; non-bulk 0')
          NODE
      - name: Verify repository
        run: pnpm verify
      - name: Commit audited changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/views/HealthCenter.vue
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m "chore(web): normalize health center template formatting"
          git push origin HEAD:chore/phase4-batch28-health-center-format-20260915
