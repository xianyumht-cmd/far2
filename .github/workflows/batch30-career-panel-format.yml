name: Batch 30 Career Panel Formatting Cleanup

on:
  push:
    branches: [chore/phase4-batch30-career-panel-format-20260916]
    paths: [.github/workflows/batch30-career-panel-format.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/phase4-batch30-career-panel-format-20260916
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply audited single-file autofix
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'
          import { createRequire } from 'node:module'

          const root = process.cwd()
          const cwd = path.join(root, 'web')
          const req = createRequire(path.join(cwd, 'package.json'))
          const { ESLint } = await import(`file://${req.resolve('eslint').replaceAll('\\', '/')}`)
          const file = 'src/components/CareerPanel.vue'
          const allowed = new Set(['vue/singleline-html-element-content-newline', 'unocss/order', 'vue/html-indent'])

          const before = await new ESLint({ cwd, fix: false }).lintFiles([file])
          let total = 0
          const counts = new Map()
          const unexpected = []
          for (const report of before) for (const message of report.messages || []) {
            if (!message.severity) continue
            total++
            counts.set(message.ruleId, (counts.get(message.ruleId) || 0) + 1)
            if (!allowed.has(message.ruleId)) unexpected.push(`${message.line}:${message.ruleId}`)
          }
          if (total < 1) throw new Error('Expected at least one pre-fix finding')
          if (unexpected.length) throw new Error(`Unexpected rules: ${unexpected.join(',')}`)
          console.log(`Batch 30 pre-fix findings: ${total}`)
          console.log(JSON.stringify(Object.fromEntries([...counts].sort()), null, 2))
          fs.writeFileSync(path.join(root, '.batch30-count'), String(total))

          const fixed = await new ESLint({ cwd, fix: true }).lintFiles([file])
          await ESLint.outputFixes(fixed)

          const after = await new ESLint({ cwd, fix: false }).lintFiles([file])
          const remaining = after.flatMap(report => (report.messages || []).filter(message => message.severity).map(message => `${message.line}:${message.ruleId}`))
          if (remaining.length) throw new Error(`Expected file clean, got ${remaining.join(',')}`)
          console.log(`Batch 30 selected-file autofix PASS: ${total} -> 0`)
          NODE
      - name: Confirm repository lint total
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'
          import { createRequire } from 'node:module'
          const root = process.cwd()
          async function lint(workspace, targets) {
            const cwd = path.join(root, workspace)
            const req = createRequire(path.join(cwd, 'package.json'))
            const { ESLint } = await import(`file://${req.resolve('eslint').replaceAll('\\', '/')}`)
            return new ESLint({ cwd, fix: false }).lintFiles(targets)
          }
          const removed = Number(fs.readFileSync(path.join(root, '.batch30-count'), 'utf8'))
          const expected = 377 - removed
          const reports = [...await lint('core', ['.']), ...await lint('web', ['src/**/*.{ts,vue}'])]
          const bulk = new Set(['vue/singleline-html-element-content-newline', 'unocss/order', 'vue/html-indent'])
          let total = 0
          let nonBulk = 0
          for (const report of reports) for (const message of report.messages || []) {
            if (!message.severity) continue
            total++
            if (!bulk.has(message.ruleId)) nonBulk++
          }
          if (total !== expected) throw new Error(`Expected total lint findings ${expected}, got ${total}`)
          if (nonBulk !== 0) throw new Error(`Expected non-bulk findings 0, got ${nonBulk}`)
          console.log(`Batch 30 repository lint PASS: total ${total}; removed ${removed}; non-bulk 0`)
          NODE
      - name: Verify repository
        run: pnpm verify
      - name: Commit audited changes
        run: |
          rm -f .batch30-count
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/components/CareerPanel.vue
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m "chore(web): normalize career panel template formatting"
          git push origin HEAD:chore/phase4-batch30-career-panel-format-20260916
