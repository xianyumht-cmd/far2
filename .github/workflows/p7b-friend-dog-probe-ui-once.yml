name: P7B friend dog probe UI one-shot

on:
  push:
    branches:
      - feat/p7b-friend-dog-probe-ui-20260813

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p7b-friend-dog-probe-ui-20260813

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Apply exact UI patch
        run: python .github/scripts/p7b-friend-dog-probe-ui-patch.py

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate UI
        run: |
          pnpm build:web
          git diff --check

      - name: Commit only intended source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/stores/friend.ts web/src/views/Friends.vue
          git rm .github/scripts/p7b-friend-dog-probe-ui-patch.py .github/workflows/p7b-friend-dog-probe-ui-once.yml
          git commit -m "feat: show friend dog protocol probe in UI"
          git push origin HEAD:feat/p7b-friend-dog-probe-ui-20260813
