name: P3B friend mutation validation

on:
  push:
    branches:
      - feat/p3b-friend-mutation-readonly-20260813

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p3b-friend-mutation-readonly-20260813

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate P3B and dependent contracts
        run: |
          pnpm friend:mutation-selftest
          pnpm mutation:readonly-selftest
          pnpm planting:2x2-selftest
          pnpm farm:query-selftest
          pnpm build:web
          node --check core/src/services/friend.js
          git diff --check
