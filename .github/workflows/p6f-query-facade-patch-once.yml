name: P6F farm query/facade source patch

on:
  push:
    branches:
      - refactor/p6f-farm-query-facade-20260813

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/p6f-farm-query-facade-20260813

      - name: Apply exact P6F source patch
        run: |
          python scripts/p6f-query-facade-patch-once.py
          node --check core/src/services/farm-query-service.js
          node --check core/scripts/farm-query-selftest.js
          node --check core/src/services/farm.js
          git diff --check

      - name: Commit only intended source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/services/farm.js core/package.json package.json
          git rm scripts/p6f-query-facade-patch-once.py .github/workflows/p6f-query-facade-patch-once.yml
          git commit -m "refactor: turn farm service into facade"
          git push origin HEAD:refactor/p6f-farm-query-facade-20260813
