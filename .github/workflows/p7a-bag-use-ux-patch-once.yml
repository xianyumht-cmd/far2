name: P7A bag use UX source patch

on:
  push:
    branches:
      - feat/p7a-bag-use-ux-20260813

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p7a-bag-use-ux-20260813

      - name: Apply exact P7A source patch
        run: |
          python scripts/p7a-bag-use-ux-patch-once.py
          node --check core/src/services/warehouse.js
          node --check core/src/core/worker.js
          node --check core/scripts/bag-use-ux-selftest.js
          git diff --check

      - name: Commit only intended source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/services/warehouse.js core/src/core/worker.js web/src/components/BagPanel.vue core/package.json package.json
          git rm scripts/p7a-bag-use-ux-patch-once.py .github/workflows/p7a-bag-use-ux-patch-once.yml
          git commit -m "feat: make manual bag use quantity-safe"
          git push origin HEAD:feat/p7a-bag-use-ux-20260813
