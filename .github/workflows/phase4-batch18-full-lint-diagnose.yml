name: Phase4 Batch18 Full Lint Diagnose

on:
  push:
    branches:
      - chore/phase4-batch18-full-lint-diagnose-20260915

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Inventory full lint debt
        shell: bash
        run: |
          set +e
          pnpm -C core exec eslint . --format json > /tmp/core-lint.json
          core_status=$?
          pnpm -C web exec eslint 'src/**/*.{ts,vue}' --format json > /tmp/web-lint.json
          web_status=$?
          set -e
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.cwd();
          const reports = [
            ...JSON.parse(fs.readFileSync('/tmp/core-lint.json', 'utf8')),
            ...JSON.parse(fs.readFileSync('/tmp/web-lint.json', 'utf8')),
          ];
          const msgs = [];
          for (const row of reports) {
            const file = path.relative(root, row.filePath).replaceAll('\\', '/');
            for (const m of row.messages || []) {
              if (!m.severity) continue;
              msgs.push({
                file,
                rule: m.ruleId || 'unknown-rule',
                fix: !!m.fix,
                line: m.line,
                column: m.column,
                message: m.message,
              });
            }
          }
          const byRule = new Map();
          const byFile = new Map();
          for (const m of msgs) {
            const r = byRule.get(m.rule) || { total: 0, fix: 0 };
            r.total += 1;
            if (m.fix) r.fix += 1;
            byRule.set(m.rule, r);
            const f = byFile.get(m.file) || { total: 0, fix: 0, rules: new Map(), msgs: [] };
            f.total += 1;
            if (m.fix) f.fix += 1;
            f.rules.set(m.rule, (f.rules.get(m.rule) || 0) + 1);
            f.msgs.push(m);
            byFile.set(m.file, f);
          }
          console.log(`TOTAL=${msgs.length} FIXABLE=${msgs.filter(m => m.fix).length} FILES=${byFile.size}`);
          console.log('=== RULES ===');
          for (const [rule, v] of [...byRule].sort((a,b) => b[1].total-a[1].total || a[0].localeCompare(b[0]))) {
            console.log(`${v.total} fix=${v.fix} ${rule}`);
          }
          console.log('=== FILES ===');
          for (const [file, v] of [...byFile].sort((a,b) => b[1].total-a[1].total || a[0].localeCompare(b[0]))) {
            console.log(`${v.total} fix=${v.fix} ${file} [${[...v.rules].map(([r,c]) => `${r}:${c}`).join(', ')}]`);
          }
          console.log('=== SMALL FILE DETAILS (<=3 findings) ===');
          for (const [file, v] of [...byFile].filter(([,v]) => v.total <= 3).sort((a,b) => a[0].localeCompare(b[0]))) {
            for (const m of v.msgs) console.log(`${m.fix ? 'FIX' : 'MAN'} ${file}:${m.line}:${m.column} ${m.rule} :: ${m.message}`);
          }
          NODE
          echo "core eslint exit=$core_status web eslint exit=$web_status"
