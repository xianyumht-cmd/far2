name: Phase 4 Zero-Debt ESLint Gate Validation

on:
  push:
    branches: [chore/phase4-zero-debt-eslint-gate-20260916]
    paths:
      - .quality/eslint-baseline.json
      - .github/workflows/phase4-zero-debt-eslint-gate.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Confirm zero-debt baseline shape
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const baseline = JSON.parse(fs.readFileSync('.quality/eslint-baseline.json', 'utf8'))
          if (baseline.totalIssues !== 0) throw new Error(`Expected totalIssues=0, got ${baseline.totalIssues}`)
          if (!baseline.entries || Object.keys(baseline.entries).length !== 0) throw new Error('Expected empty ESLint baseline entries')
          console.log('Zero-debt baseline shape PASS')
          NODE
      - name: Confirm clean repository passes gate
        run: pnpm lint:baseline
      - name: Confirm any new lint finding fails gate
        run: |
          printf '\nconst zeroDebtLintProbe = 1;\n' >> core/src/controllers/admin.js
          set +e
          pnpm lint:baseline
          status=$?
          set -e
          git checkout -- core/src/controllers/admin.js
          if [ "$status" -eq 0 ]; then
            echo 'Expected zero-debt gate to reject an injected lint finding'
            exit 1
          fi
          git diff --exit-code
          echo 'Injected lint finding was rejected as expected'
      - name: Verify repository
        run: pnpm verify
