name: P6 completion docs patch

on:
  push:
    branches:
      - docs/p6-architecture-complete-20260813

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/p6-architecture-complete-20260813

      - name: Apply exact state patch
        run: |
          python scripts/p6-state-docs-patch-once.py
          git diff --check
          grep -q 'P6A～P6F：Farm 架构收口' PROJECT_STATE.md
          grep -q 'P6 到这里结束' docs/P6_ARCHITECTURE_CONSOLIDATION_2026-08-13.md

      - name: Commit only docs and remove temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md docs/P6_ARCHITECTURE_CONSOLIDATION_2026-08-13.md
          git rm scripts/p6-state-docs-patch-once.py .github/workflows/p6-state-docs-patch-once.yml
          git commit -m "docs: close P6 architecture consolidation"
          git push origin HEAD:docs/p6-architecture-complete-20260813
