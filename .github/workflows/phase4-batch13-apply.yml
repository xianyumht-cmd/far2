name: Phase4 Batch13 Apply

on:
  push:
    branches:
      - chore/phase4-batch13-wmpf-safetext-20260915

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact Batch13 fixes
        shell: bash
        run: |
          set -euo pipefail
          files=(
            core/src/services/wechat-wmpf-native-capture.js
            core/src/services/wechat-wmpf-resident-capture.js
          )
          core_files=(
            src/services/wechat-wmpf-native-capture.js
            src/services/wechat-wmpf-resident-capture.js
          )

          set +e
          pnpm -C core exec eslint "${core_files[@]}" --format json > /tmp/batch13-before.json
          before_status=$?
          set -e

          node <<'NODE'
          const fs = require('node:fs');
          const rows = JSON.parse(fs.readFileSync('/tmp/batch13-before.json', 'utf8'));
          const messages = rows.flatMap(row => row.messages || []).filter(m => m.ruleId);
          if (messages.length !== 8) throw new Error(`expected exactly 8 findings, got ${messages.length}: ${JSON.stringify(messages)}`);
          const rules = new Map();
          let fixable = 0;
          for (const m of messages) {
            rules.set(m.ruleId, (rules.get(m.ruleId) || 0) + 1);
            if (m.fix) fixable += 1;
          }
          const expected = new Map([
            ['regexp/prefer-w', 2],
            ['regexp/use-ignore-case', 2],
            ['no-unmodified-loop-condition', 4],
          ]);
          if (rules.size !== expected.size) throw new Error(`unexpected rule set: ${JSON.stringify([...rules])}`);
          for (const [rule, count] of expected) {
            if (rules.get(rule) !== count) throw new Error(`expected ${count} ${rule}, got ${rules.get(rule) || 0}`);
          }
          if (fixable !== 4) throw new Error(`expected exactly 4 fixable findings, got ${fixable}`);
          for (const m of messages) {
            if (m.ruleId === 'no-unmodified-loop-condition') {
              if (m.fix) throw new Error(`loop-condition unexpectedly fixable at ${m.line}:${m.column}`);
            } else if (!m.fix) {
              throw new Error(`${m.ruleId} unexpectedly lacks fixer at ${m.line}:${m.column}`);
            }
          }
          console.log('preflight PASS: 8 findings = 4 approved regexp autofixes + 4 preserved loop findings');
          NODE
          test "$before_status" -ne 0

          pnpm -C core exec eslint "${core_files[@]}" --fix || true

          set +e
          pnpm -C core exec eslint "${core_files[@]}" --format json > /tmp/batch13-after.json
          after_status=$?
          set -e

          node <<'NODE'
          const fs = require('node:fs');
          const rows = JSON.parse(fs.readFileSync('/tmp/batch13-after.json', 'utf8'));
          const messages = rows.flatMap(row => row.messages || []).filter(m => m.ruleId);
          if (messages.length !== 4) throw new Error(`expected exactly 4 preserved findings, got ${messages.length}: ${JSON.stringify(messages)}`);
          if (messages.some(m => m.ruleId !== 'no-unmodified-loop-condition')) throw new Error(`unexpected post-fix rule: ${JSON.stringify(messages)}`);
          if (messages.some(m => m.fix)) throw new Error(`post-fix loop finding unexpectedly fixable: ${JSON.stringify(messages)}`);
          console.log('post-fix PASS: only 4 pre-existing loop-condition findings remain');
          NODE
          test "$after_status" -ne 0

          mapfile -t product_changed < <(git diff --name-only | grep -vE '^[^/]+\.cmd$|^web/stats\.html$' || true)
          printf 'product diff before verify:\n%s\n' "${product_changed[*]}"
          test "${#product_changed[@]}" -eq 2
          for file in "${files[@]}"; do
            printf '%s\n' "${product_changed[@]}" | grep -Fxq "$file"
            git diff --check -- "$file"
          done

      - name: Verify repository
        run: pnpm verify

      - name: Diff integrity
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- pnpm-lock.yaml core/pnpm-lock.yaml web/pnpm-lock.yaml
          mapfile -t unexpected < <(git diff --name-only | grep -vE '^[^/]+\.cmd$|^web/stats\.html$|^core/src/services/wechat-wmpf-native-capture\.js$|^core/src/services/wechat-wmpf-resident-capture\.js$' || true)
          if (( ${#unexpected[@]} )); then
            printf 'unexpected post-verify diff: %s\n' "${unexpected[@]}"
            exit 1
          fi
          git diff --check -- \
            core/src/services/wechat-wmpf-native-capture.js \
            core/src/services/wechat-wmpf-resident-capture.js
          git status --short

      - name: Commit verified product change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            core/src/services/wechat-wmpf-native-capture.js \
            core/src/services/wechat-wmpf-resident-capture.js
          git commit -m "chore(quality): normalize WMPF safeText regexes"
          git push origin HEAD:chore/phase4-batch13-wmpf-safetext-20260915
