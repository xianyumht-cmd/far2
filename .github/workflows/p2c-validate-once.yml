name: P2C one-shot web validation

on:
  push:
    branches:
      - fix/p2c-independent-2x2-priority-20260813

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p2c-independent-2x2-priority-20260813
          fetch-depth: 1

      - name: Complete settings persistence wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 anchor, found {count}')
              return text.replace(old, new, 1)

          path = Path('web/src/stores/setting.ts')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '  preferredSeedId: number\n  bagSeedPriority: number[]',
              '  preferredSeedId: number\n  prioritize2x2Crops: boolean\n  bagSeedPriority: number[]',
              'settings type',
          )
          text = replace_once(
              text,
              "    preferredSeedId: 0,\n    bagSeedPriority: [],",
              "    preferredSeedId: 0,\n    prioritize2x2Crops: true,\n    bagSeedPriority: [],",
              'settings default',
          )
          text = replace_once(
              text,
              "        settings.value.preferredSeedId = d.preferredSeed || 0\n        settings.value.intervals = d.intervals || {}",
              "        settings.value.preferredSeedId = d.preferredSeed || 0\n        settings.value.prioritize2x2Crops = d.prioritize2x2Crops !== false\n        settings.value.intervals = d.intervals || {}",
              'settings fetch',
          )
          text = replace_once(
              text,
              "        preferredSeedId: newSettings.preferredSeedId,\n        bagSeedPriority: newSettings.bagSeedPriority ?? [],",
              "        preferredSeedId: newSettings.preferredSeedId,\n        prioritize2x2Crops: newSettings.prioritize2x2Crops !== false,\n        bagSeedPriority: newSettings.bagSeedPriority ?? [],",
              'settings save payload',
          )
          path.write_text(text, encoding='utf-8')

          path = Path('core/src/controllers/admin.js')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              "            const preferredSeed = id ? store.getPreferredSeed(id) : null;\n            const friendQuietHours = id ? store.getFriendQuietHours(id) : null;",
              "            const preferredSeed = id ? store.getPreferredSeed(id) : null;\n            const prioritize2x2Crops = id && typeof store.getPrioritize2x2Crops === 'function' ? store.getPrioritize2x2Crops(id) : true;\n            const friendQuietHours = id ? store.getFriendQuietHours(id) : null;",
              'admin settings getter',
          )
          text = replace_once(
              text,
              'res.json({ ok: true, data: { intervals, strategy, preferredSeed, friendQuietHours, automation, stealDelaySeconds, plantOrderRandom, plantDelaySeconds, fertilizerBuyOrganicCount, fertilizerBuyOrganicThresholdHours, fertilizerBuyNormalCount, fertilizerBuyNormalThresholdHours, fertilizerBuyCheckIntervalMinutes, bagSeedPriority, bagSeedFallbackStrategy, ui, offlineReminder } });',
              'res.json({ ok: true, data: { intervals, strategy, preferredSeed, prioritize2x2Crops, friendQuietHours, automation, stealDelaySeconds, plantOrderRandom, plantDelaySeconds, fertilizerBuyOrganicCount, fertilizerBuyOrganicThresholdHours, fertilizerBuyNormalCount, fertilizerBuyNormalThresholdHours, fertilizerBuyCheckIntervalMinutes, bagSeedPriority, bagSeedFallbackStrategy, ui, offlineReminder } });',
              'admin settings response',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate P2C and web build
        run: |
          pnpm planting:2x2-selftest
          pnpm build:web
          node --check core/src/models/store.js
          node --check core/src/controllers/admin.js
          node --check core/src/services/farm-2x2.js
          node --check core/src/services/farm-2x2-priority.js
          node --check core/src/services/farm.js
          git diff --check

      - name: Commit validated settings wiring and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/p2c-validate-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: persist independent 2x2 planting setting"
          git push origin HEAD:fix/p2c-independent-2x2-priority-20260813
