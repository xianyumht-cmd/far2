name: Phase4 Batch8 Apply

on:
  push:
    branches:
      - chore/phase4-batch8-mystery-shop-regex-20260915

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact mystery-shop regexp fixes
        shell: bash
        run: |
          set +e
          pnpm -C core exec eslint src/services/mystery-shop.js --format json > /tmp/mystery-before.json
          before_status=$?
          set -e
          node <<'NODE'
          const fs = require('node:fs');
          const rows = JSON.parse(fs.readFileSync('/tmp/mystery-before.json', 'utf8'));
          const messages = rows.flatMap(row => row.messages || []).filter(m => m.ruleId);
          const expected = new Map([
            ['regexp/prefer-w', 5],
            ['regexp/use-ignore-case', 1],
            ['regexp/no-dupe-characters-character-class', 4],
            ['regexp/sort-flags', 4],
          ]);
          if (messages.length !== 14) {
            throw new Error(`expected exactly 14 mystery-shop findings, got ${messages.length}`);
          }
          const actual = new Map();
          for (const m of messages) actual.set(m.ruleId, (actual.get(m.ruleId) || 0) + 1);
          if (actual.size !== expected.size) throw new Error(`unexpected rule set: ${JSON.stringify([...actual])}`);
          for (const [rule, count] of expected) {
            if (actual.get(rule) !== count) throw new Error(`expected ${count} ${rule}, got ${actual.get(rule) || 0}`);
            for (const m of messages.filter(x => x.ruleId === rule)) {
              if (!m.fix) throw new Error(`${rule} at ${m.line}:${m.column} has no ESLint fix`);
            }
          }
          console.log('preflight PASS: exact 14 auto-fixable mystery-shop regexp findings');
          NODE
          test "$before_status" -ne 0
          pnpm -C core exec eslint src/services/mystery-shop.js --fix
          pnpm -C core exec eslint src/services/mystery-shop.js --format json > /tmp/mystery-after.json
          node <<'NODE'
          const fs = require('node:fs');
          const rows = JSON.parse(fs.readFileSync('/tmp/mystery-after.json', 'utf8'));
          const messages = rows.flatMap(row => row.messages || []).filter(m => m.ruleId);
          if (messages.length !== 0) throw new Error(`expected zero mystery-shop findings after fix, got ${messages.length}: ${JSON.stringify(messages)}`);
          console.log('post-fix PASS: mystery-shop has zero ESLint findings');
          NODE
          git restore -- '*.cmd'
          mapfile -t changed < <(git diff --name-only)
          printf 'changed-before-verify: %s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "core/src/services/mystery-shop.js"
          git diff --check -- core/src/services/mystery-shop.js
      - name: Verify repository
        run: pnpm verify
      - name: Diff integrity
        shell: bash
        run: |
          git diff --check
          git diff --exit-code -- pnpm-lock.yaml core/pnpm-lock.yaml web/pnpm-lock.yaml
          git status --short
      - name: Commit verified product change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/services/mystery-shop.js
          git commit -m "chore(quality): normalize mystery-shop regexes"
          git push origin HEAD:chore/phase4-batch8-mystery-shop-regex-20260915
