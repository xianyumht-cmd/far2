name: P2 P3 handoff patch

on:
  push:
    branches:
      - docs/p2-p3-handoff-20260813

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/p2-p3-handoff-20260813
          fetch-depth: 1

      - name: Patch project state
        run: python3 scripts/project-state-p2-p3-patch.py

      - name: Check markdown diff
        run: git diff --check

      - name: Commit handoff update
        run: |
          rm -f .github/workflows/docs-p2-p3-patch-once.yml scripts/project-state-p2-p3-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md
          git add -u .github/workflows/docs-p2-p3-patch-once.yml scripts/project-state-p2-p3-patch.py
          git commit -m "docs: advance handoff through P3A"
          git push origin HEAD:docs/p2-p3-handoff-20260813
