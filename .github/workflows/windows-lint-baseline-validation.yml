name: Windows Lint Baseline Validation

on:
  push:
    branches:
      - fix/windows-lint-baseline-node24-20260915

permissions:
  contents: read

jobs:
  windows-lint-baseline:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run through pnpm lifecycle
        run: pnpm lint:baseline
      - name: Run script directly
        run: node scripts/lint-baseline-check.mjs
