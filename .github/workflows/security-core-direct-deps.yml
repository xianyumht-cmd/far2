name: Validate Core Direct Dependency Security Update

on:
  push:
    branches: [fix/security-core-direct-deps-20260917]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Update audited direct production dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter qq-farm-bot update axios@^1.18.0 protobufjs@^8.6.6 ws@^8.21.0
      - name: Confirm patched dependency floors
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const pkg = require('./core/package.json')
          const floors = {
            axios: [1, 18, 0],
            protobufjs: [8, 6, 6],
            ws: [8, 21, 0],
          }
          const parse = (value) => {
            const match = String(value).match(/(\d+)\.(\d+)\.(\d+)/)
            if (!match) throw new Error(`cannot parse version from ${value}`)
            return match.slice(1).map(Number)
          }
          const atLeast = (actual, floor) => {
            for (let i = 0; i < 3; i += 1) {
              if (actual[i] > floor[i]) return true
              if (actual[i] < floor[i]) return false
            }
            return true
          }
          for (const [name, floor] of Object.entries(floors)) {
            const spec = pkg.dependencies[name]
            const actual = parse(spec)
            if (!atLeast(actual, floor)) {
              throw new Error(`${name}: expected >=${floor.join('.')}, got ${spec}`)
            }
            console.log(`${name} ${spec}`)
          }
          NODE
      - name: Ensure no critical production advisory remains
        run: pnpm audit --prod --audit-level critical
      - name: Verify repository
        run: pnpm verify
      - name: Commit validated dependency update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name xianyumht-cmd
          git config user.email xianyumht@gmail.com
          git add core/package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'No dependency changes to commit' >&2
            exit 1
          fi
          git commit -m 'fix(security): update core direct dependencies'
          git push origin HEAD:fix/security-core-direct-deps-20260917
