name: Validate Socket.IO Security Overrides

on:
  push:
    branches: [chore/security-socketio-overrides-20260917]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply narrow Socket.IO child overrides
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          pkg.pnpm ||= {};
          pkg.pnpm.overrides ||= {};
          pkg.pnpm.overrides['socket.io>engine.io'] = '6.6.10';
          pkg.pnpm.overrides['socket.io>socket.io-parser'] = '4.2.7';
          fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
          pnpm --filter qq-farm-bot list socket.io engine.io socket.io-parser ws --depth 5
      - name: Verify repository
        run: pnpm verify
      - name: Confirm Socket.IO audit paths are clean
        shell: bash
        run: |
          set +e
          pnpm audit --prod --json > prod-audit.json
          code=$?
          set -e
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('prod-audit.json', 'utf8'));
          const bad = [];
          for (const [id, advisory] of Object.entries(data.advisories || {})) {
            for (const finding of advisory.findings || []) {
              for (const p of finding.paths || []) {
                if (p.startsWith('core>socket.io>')) bad.push({id,module:advisory.module_name,severity:advisory.severity,version:finding.version,path:p,patched:advisory.patched_versions});
              }
            }
          }
          console.log(JSON.stringify(data.metadata || {}, null, 2));
          if (bad.length) {
            console.error('Socket.IO audit paths remain vulnerable:', JSON.stringify(bad, null, 2));
            process.exit(1);
          }
          console.log('No production audit findings remain under core>socket.io>.');
          NODE
          echo "PROD_AUDIT_EXIT=$code"
      - name: Commit production changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml
          unexpected=$(git diff --name-only --cached | grep -Ev '^(package.json|pnpm-lock.yaml)$' || true)
          if [ -n "$unexpected" ]; then echo "Unexpected files: $unexpected" >&2; exit 1; fi
          git diff --cached --exit-code && { echo 'No changes to commit' >&2; exit 1; } || true
          git commit -m 'chore(security): override patched Socket.IO transitives'
          git push
