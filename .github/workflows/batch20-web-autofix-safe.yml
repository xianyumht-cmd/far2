name: Batch 20 Audited Web Autofixes

on:
  push:
    branches: [chore/phase4-batch20-web-autofix-safe-20260915]
    paths: [.github/workflows/batch20-web-autofix-safe.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/phase4-batch20-web-autofix-safe-20260915
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply audited fixes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'
          import { createRequire } from 'node:module'
          const root=process.cwd(), web=path.join(root,'web')
          const req=createRequire(path.join(web,'package.json'))
          const { ESLint }=await import(`file://${req.resolve('eslint').replaceAll('\\','/')}`)
          const eslint=new ESLint({cwd:web,fix:false})
          const targets=['src/views/AdminPanel.vue','src/components/LandCard.vue','src/views/CodeManager.vue','src/views/Catalog.vue','src/components/BagPanel.vue']
          const expected=new Map([['antfu/if-newline',4],['format/prettier',5],['perfectionist/sort-imports',1],['style/eol-last',1],['style/no-trailing-spaces',5],['antfu/curly',1],['vue/no-useless-v-bind',1]])
          const selected=new Set(expected.keys())
          function apply(file, fixes) {
            let s=fs.readFileSync(file,'utf8')
            fixes.sort((a,b)=>b.range[0]-a.range[0]||b.range[1]-a.range[1])
            let last=Infinity
            for(const f of fixes){const [a,b]=f.range;if(b>last)throw new Error(`overlap ${file}`);s=s.slice(0,a)+f.text+s.slice(b);last=a}
            fs.writeFileSync(file,s)
          }
          function collect(results, rule) {
            return results.flatMap(r=>r.messages.filter(m=>m.ruleId===rule).map(m=>({filePath:r.filePath,m})))
          }
          const results=await eslint.lintFiles(targets), counts=new Map(), byFile=new Map()
          for(const r of results)for(const m of r.messages){if(!selected.has(m.ruleId))continue;if(!m.fix?.range)throw new Error(`not fixable ${r.filePath}:${m.line} ${m.ruleId}`);counts.set(m.ruleId,(counts.get(m.ruleId)||0)+1);const a=byFile.get(r.filePath)||[];a.push({range:m.fix.range,text:m.fix.text});byFile.set(r.filePath,a)}
          for(const [rule,n] of expected)if((counts.get(rule)||0)!==n)throw new Error(`expected ${n} ${rule}, got ${counts.get(rule)||0}`)
          if([...counts.values()].reduce((a,b)=>a+b,0)!==18)throw new Error('expected 18 primary fixes')
          for(const [file,fixes] of byFile)apply(file,fixes)

          const [admin]=await eslint.lintFiles(['src/views/AdminPanel.vue'])
          const trailing=admin.messages.filter(m=>m.ruleId==='style/no-trailing-spaces')
          if(trailing.length!==4||trailing.some(m=>!m.fix?.range))throw new Error(`expected 4 follow-up trailing-space fixes, got ${trailing.length}`)
          apply(admin.filePath,trailing.map(m=>({range:m.fix.range,text:m.fix.text})))

          const indented=await eslint.lintFiles(targets)
          const indent=collect(indented,'style/indent')
          if(indent.length!==5||indent.some(x=>!x.m.fix?.range))throw new Error(`expected 5 generated style/indent fixes, got ${indent.length}`)
          const indentByFile=new Map()
          for(const {filePath,m} of indent){const a=indentByFile.get(filePath)||[];a.push({range:m.fix.range,text:m.fix.text});indentByFile.set(filePath,a)}
          for(const [file,fixes] of indentByFile)apply(file,fixes)

          const after=await eslint.lintFiles(targets)
          const guarded=new Set([...selected,'style/indent'])
          const leftovers=after.flatMap(r=>r.messages.filter(m=>guarded.has(m.ruleId)).map(m=>`${r.filePath}:${m.line}:${m.column} ${m.ruleId}`))
          if(leftovers.length)throw new Error(`guarded leftovers:\n${leftovers.join('\n')}`)
          console.log('Batch 20: 18 primary + 4 trailing-space + 5 indentation fixes applied; guarded findings 0')
          NODE
      - name: Verify repository
        run: pnpm verify
      - name: Commit audited fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/views/AdminPanel.vue web/src/components/LandCard.vue web/src/views/CodeManager.vue web/src/views/Catalog.vue web/src/components/BagPanel.vue
          git diff --cached --check
          git diff --cached --stat
          git commit -m "chore(web): clear batch 20 safe lint debt"
          git push origin HEAD:chore/phase4-batch20-web-autofix-safe-20260915
