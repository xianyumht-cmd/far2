name: Validate Self-Hosted WebFonts

on:
  push:
    branches: [fix/webfont-selfhost-20260916]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/webfont-selfhost-20260916
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply self-hosted font dependencies and config
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C web add --save-exact @fontsource/dm-sans@5.3.0 @fontsource/dm-mono@5.3.0
          python - <<'PY'
          from pathlib import Path

          uno = Path('web/uno.config.ts')
          text = uno.read_text()
          old_import = "import { defineConfig, presetAttributify, presetIcons, presetUno, presetWebFonts } from 'unocss'"
          new_import = "import { defineConfig, presetAttributify, presetIcons, presetUno } from 'unocss'"
          old_block = """    presetWebFonts({\n      fonts: {\n        sans: 'DM Sans',\n        serif: 'DM Serif Display',\n        mono: 'DM Mono',\n      },\n    }),\n"""
          if old_import in text:
              text = text.replace(old_import, new_import)
          elif new_import not in text:
              raise SystemExit('unexpected UnoCSS import shape')
          if old_block in text:
              text = text.replace(old_block, '')
          elif 'presetWebFonts(' in text:
              raise SystemExit('unexpected presetWebFonts config shape')
          theme_block = """  theme: {\n    fontFamily: {\n      mono: 'DM Mono, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, \\\"Liberation Mono\\\", \\\"Courier New\\\", monospace',\n    },\n  },\n"""
          if '  theme: {' not in text:
              text = text.replace('  presets: [\n', theme_block + '  presets: [\n')
          elif "mono: 'DM Mono," not in text:
              raise SystemExit('unexpected existing theme config')
          uno.write_text(text)

          main = Path('web/src/main.ts')
          text = main.read_text()
          marker = "import router from './router'\n"
          font_imports = "import '@fontsource/dm-sans/400.css'\nimport '@fontsource/dm-mono/400.css'\n"
          if font_imports not in text:
              if marker not in text:
                  raise SystemExit('main.ts import marker missing')
              text = text.replace(marker, marker + font_imports)
          main.write_text(text)
          PY
      - name: Assert production source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"@fontsource/dm-sans": "5.3.0"' web/package.json
          grep -F '"@fontsource/dm-mono": "5.3.0"' web/package.json
          grep -F "import '@fontsource/dm-sans/400.css'" web/src/main.ts
          grep -F "import '@fontsource/dm-mono/400.css'" web/src/main.ts
          ! grep -F 'presetWebFonts' web/uno.config.ts
          grep -F "mono: 'DM Mono," web/uno.config.ts
      - name: Verify repository
        run: pnpm verify
      - name: Assert build has only local DM font assets
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'
          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const p = path.join(dir, entry.name)
              return entry.isDirectory() ? walk(p) : [p]
            })
          }
          const files = walk('web/dist')
          const css = files.filter(f => f.endsWith('.css')).map(f => fs.readFileSync(f, 'utf8')).join('\n')
          if (/fonts\.(googleapis|gstatic)\.com/i.test(css)) throw new Error('Google font URL remains in built CSS')
          if (!css.includes('DM Sans')) throw new Error('DM Sans missing from built CSS')
          if (!css.includes('DM Mono')) throw new Error('DM Mono missing from built CSS')
          if (css.includes('DM Serif Display')) throw new Error('Unused DM Serif Display still emitted')
          const faces = [...css.matchAll(/@font-face\s*\{([^}]*)\}/g)].map(m => m[1]).filter(b => /DM Sans|DM Mono/.test(b))
          if (faces.length < 2) throw new Error(`Expected local DM font faces, got ${faces.length}`)
          for (const face of faces) {
            if (/https?:\/\//i.test(face)) throw new Error(`Remote URL remains in font face: ${face}`)
            if (!/url\([^)]*\.woff2/i.test(face)) throw new Error(`Expected bundled woff2 URL: ${face}`)
          }
          const woff2 = files.filter(f => f.endsWith('.woff2'))
          if (!woff2.length) throw new Error('No bundled woff2 assets emitted')
          console.log(`Self-hosted font build PASS: ${faces.length} DM font faces; ${woff2.length} bundled woff2 assets; no Google URLs`)
          NODE
      - name: Commit production files if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package.json pnpm-lock.yaml web/src/main.ts web/uno.config.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Production files already applied'
          else
            git commit -m "fix(web): self-host DM fonts"
            git push origin HEAD:fix/webfont-selfhost-20260916
          fi

  windows-build:
    needs: apply-and-verify
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/webfont-selfhost-20260916
          fetch-depth: 0
      - name: Refresh branch after apply job
        shell: bash
        run: |
          git fetch origin fix/webfont-selfhost-20260916
          git reset --hard origin/fix/webfont-selfhost-20260916
      - uses: pnpm/action-setup@v5
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C web build
      - name: Assert Windows build has no Google font dependency
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'
          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const p = path.join(dir, entry.name)
              return entry.isDirectory() ? walk(p) : [p]
            })
          }
          const files = walk('web/dist')
          const css = files.filter(f => f.endsWith('.css')).map(f => fs.readFileSync(f, 'utf8')).join('\n')
          if (/fonts\.(googleapis|gstatic)\.com/i.test(css)) throw new Error('Google font URL remains in Windows build')
          if (!css.includes('DM Sans') || !css.includes('DM Mono')) throw new Error('Expected DM font families missing')
          if (css.includes('DM Serif Display')) throw new Error('Unused serif font still emitted')
          const woff2 = files.filter(f => f.endsWith('.woff2'))
          if (!woff2.length) throw new Error('No local woff2 assets emitted')
          console.log(`Windows self-hosted font build PASS: ${woff2.length} local woff2 assets; no Google URLs`)
          NODE
