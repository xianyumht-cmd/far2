name: Diagnose UnoCSS WebFont Usage

on:
  push:
    branches: [diag/font-preset-usage-20260916]

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prove configured webfonts are unused
        shell: bash
        run: |
          set -euo pipefail
          echo '=== source references ==='
          if grep -R -n -E '(DM Sans|DM Serif Display|DM Mono|font-(sans|serif|mono)|font-family)' web/src web/index.html; then
            echo 'Unexpected source font reference found'
            exit 1
          fi
          echo 'NO_SOURCE_FONT_REFERENCES'

          pnpm -C web build

          echo '=== emitted references ==='
          if grep -R -n -E '(DM Sans|DM Serif Display|DM Mono|fonts\.googleapis\.com|fonts\.gstatic\.com)' web/dist; then
            echo 'Unexpected emitted webfont reference found'
            exit 1
          fi
          echo 'NO_DIST_WEBFONT_REFERENCES'
      - name: Compare build after removing unused webfont preset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/far2-web-baseline
          cp -a web/dist /tmp/far2-web-baseline
          python - <<'PY'
          from pathlib import Path
          p = Path('web/uno.config.ts')
          s = p.read_text()
          s = s.replace(', presetWebFonts', '')
          block = """    presetWebFonts({\n      fonts: {\n        sans: 'DM Sans',\n        serif: 'DM Serif Display',\n        mono: 'DM Mono',\n      },\n    }),\n"""
          if block not in s:
              raise SystemExit('expected presetWebFonts block not found')
          p.write_text(s.replace(block, ''))
          PY
          pnpm -C web build
          diff -qr /tmp/far2-web-baseline web/dist
          echo 'BUILD_OUTPUT_IDENTICAL_WITHOUT_WEBFONT_PRESET'
          git checkout -- web/uno.config.ts
      - name: Verify repository
        run: pnpm verify
