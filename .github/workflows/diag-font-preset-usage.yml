name: Diagnose UnoCSS WebFont Usage

on:
  push:
    branches: [diag/font-preset-usage-20260916]

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Summarize configured and emitted webfont usage
        shell: bash
        run: |
          set -euo pipefail
          echo '=== source references ==='
          grep -R -n -E '(DM Sans|DM Serif Display|DM Mono|font-(sans|serif|mono)|font-family)' web/src web/index.html || true

          pnpm -C web build >/tmp/web-build.log 2>&1
          tail -n 8 /tmp/web-build.log

          echo '=== emitted CSS counts ==='
          for pattern in 'DM Sans' 'DM Serif Display' 'DM Mono' 'fonts.googleapis.com' 'fonts.gstatic.com' '@font-face'; do
            count="$(grep -R -F -o "$pattern" web/dist --include='*.css' 2>/dev/null | wc -l)"
            echo "$pattern=$count"
          done

          echo '=== external font URLs ==='
          grep -R -h -o -E 'https://[^)"[:space:]]+' web/dist --include='*.css' 2>/dev/null \
            | grep -E 'fonts\.(googleapis|gstatic)\.com' \
            | sort -u \
            | head -n 20 || true

          echo '=== font-face families ==='
          python - <<'PY'
          from pathlib import Path
          import re
          css = '\n'.join(p.read_text(errors='ignore') for p in Path('web/dist').rglob('*.css'))
          families = sorted(set(re.findall(r'font-family:([^;}]+)', css)))
          for value in families:
              if 'DM ' in value or 'monospace' in value or 'sans-serif' in value:
                  print(value.strip())
          PY
      - name: Verify repository
        run: pnpm verify
