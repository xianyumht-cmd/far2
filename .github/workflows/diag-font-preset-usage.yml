name: Diagnose UnoCSS WebFont Usage

on:
  push:
    branches: [diag/font-preset-usage-20260916]

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Extract emitted font-face contracts
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C web build >/tmp/web-build.log 2>&1
          python - <<'PY'
          from pathlib import Path
          import re
          css = '\n'.join(p.read_text(errors='ignore') for p in Path('web/dist').rglob('*.css'))
          blocks = re.findall(r'@font-face\s*\{([^}]*)\}', css)
          for i, block in enumerate(blocks, 1):
              def prop(name):
                  m = re.search(rf'{name}:([^;]+)', block)
                  return m.group(1).strip() if m else ''
              src = prop('src')
              url = re.search(r'url\(([^)]+)\)', src)
              print(f"FACE {i}: family={prop('font-family')} style={prop('font-style')} weight={prop('font-weight')} display={prop('font-display')} url={url.group(1) if url else ''}")
          print(f'TOTAL_FONT_FACES={len(blocks)}')
          PY
      - name: Verify repository
        run: pnpm verify
