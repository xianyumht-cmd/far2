name: Diagnose UnoCSS WebFont Usage

on:
  push:
    branches: [diag/font-preset-usage-20260916]

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Scan source and emitted assets
        shell: bash
        run: |
          set -e
          rg -n '(DM Sans|DM Serif Display|DM Mono|font-(sans|serif|mono)|font-family)' web/src web/index.html || true
          pnpm -C web build
          rg -n '(DM Sans|DM Serif Display|DM Mono|fonts.googleapis.com|fonts.gstatic.com)' web/dist || true
      - name: Verify repository
        run: pnpm verify
