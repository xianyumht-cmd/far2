name: P7A bag use UX validation

on:
  push:
    branches:
      - feat/p7a-bag-use-ux-20260813

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p7a-bag-use-ux-20260813

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate P7A
        run: |
          pnpm bag:use-ux-selftest
          pnpm build:web
          node --check core/src/services/warehouse.js
          node --check core/src/core/worker.js
          git diff --check
