name: FAR2 security phase2 P1

on:
  push:
    branches:
      - fix/security-phase2-p1-20260914

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[phase2-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/security-phase2-p1-20260914
          fetch-depth: 0

      - name: Apply narrowly scoped P1 fixes
        run: python3 core/scripts/security-phase2-apply.py

      - name: Syntax and regression verification
        shell: bash
        run: |
          node --check core/src/services/client-ip.js
          node --check core/src/controllers/admin.js
          node --check core/src/models/user-store.js
          node --check core/scripts/security-phase2-selftest.js
          node core/scripts/security-phase2-selftest.js
          node core/scripts/security-phase1-selftest.js
          node core/scripts/user-store-persistence-selftest.js
          node core/scripts/critical-json-fail-closed-selftest.js
          node core/scripts/user-card-transaction-selftest.js
          git diff --check

      - name: Commit verified P1 fixes and remove temporary execution files
        shell: bash
        run: |
          git rm .github/workflows/security-phase2-p1.yml core/scripts/security-phase2-apply.py
          git config user.name "far2-security-phase2-bot"
          git config user.email "actions@users.noreply.github.com"
          git add core/src/services/client-ip.js core/src/controllers/admin.js core/src/models/user-store.js core/scripts/security-phase2-selftest.js core/package.json docker-compose.yml docs/SECURITY_PROXY_TRUST.md
          git diff --cached --check
          git commit -m "fix(security): bound login state and harden proxy trust [phase2-bot]"
          git push origin HEAD:fix/security-phase2-p1-20260914
