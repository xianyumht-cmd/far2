syntax = "proto3";

package gamepb.dogpb;

message DogInfo {
    int64 id = 1;
    int64 expire_time = 3;
    int32 status = 4;
    int32 level = 5;
    int32 active = 7;
}

message GetDogInfoRequest {
    int64 host_gid = 1;
}

message GetDogInfoReply {
    repeated DogInfo dogs = 1;
    int64 coin = 3;
    int64 protect_time = 4;
    repeated DogFood foods = 5;
}

message DogFood {
    int64 id = 1;
    int64 duration = 2;
    int32 count = 3;
}

// P7E official-client live evidence (2026-08-14):
// DogService.AddFood request body 08 94 bf 05 10 01 decodes to
// field 1 = 90004 (1-day dog food), field 2 = 1.
// The business meaning of field 2 remains intentionally opaque.
message AddFoodRequest {
    int64 food_id = 1;
    int32 arg2 = 2;
}
